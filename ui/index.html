<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Agent Bot — Autonomous Trading</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⟐</text></svg>"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Sora:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #141210;
        --bg-surface: #1b1815;
        --bg-card: #221e1a;
        --bg-elevated: #2d2722;
        --border: #36302a;
        --border-light: #443d36;
        --text: #e6ddd4;
        --text-secondary: #a6978a;
        --text-muted: #73665a;
        --amber: #e8854a;
        --amber-dim: #cc7540;
        --teal: #4a9e8c;
        --teal-dim: #3a8a7a;
        --sage: #7ab86a;
        --coral: #d65d5d;
        --gold: #d8a84a;
        --amber-glow: rgba(232,133,74,0.08);
        --teal-glow: rgba(74,158,140,0.08);
        --sage-glow: rgba(122,184,106,0.08);
        --coral-glow: rgba(214,93,93,0.08);
        --gold-glow: rgba(216,168,74,0.08);
        --radius: 10px;
        --radius-sm: 6px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg-deep);
        background-image:
          radial-gradient(ellipse at 20% 30%, rgba(232,133,74,0.05) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 70%, rgba(74,158,140,0.04) 0%, transparent 50%);
        color: var(--text);
        font-family: "Sora", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      /* Noise grain overlay */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        opacity: 0.025;
        pointer-events: none;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='ng'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23ng)' opacity='0.5'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
      }
      /* Geometric grid background */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          linear-gradient(rgba(54,48,42,0.25) 1px, transparent 1px),
          linear-gradient(90deg, rgba(54,48,42,0.25) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
        z-index: -1;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-surface);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-light);
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes stampIn {
        from { opacity: 0; scale: 0.9; }
        to { opacity: 1; scale: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .r1 { animation: reveal 0.4s ease-out both; }
      .r2 { animation: reveal 0.4s ease-out 0.1s both; }
      .r3 { animation: reveal 0.4s ease-out 0.2s both; }
      .r4 { animation: reveal 0.4s ease-out 0.3s both; }
      .r5 { animation: reveal 0.4s ease-out 0.4s both; }
      .r6 { animation: reveal 0.4s ease-out 0.5s both; }
      .rl { animation: slideUp 0.4s ease-out both; }
      .rr { animation: slideUp 0.4s ease-out 0.08s both; }

      /* Glass-morphism navbar */
      .nav-glass {
        background: rgba(15,14,12,0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      /* Skeleton shimmer */
      .skeleton {
        background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 4px;
      }

      /* Table styles */
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10.5px;
        font-family: "DM Mono", monospace;
      }
      .data-table thead th {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        font-size: 9px;
        letter-spacing: 1px;
        font-family: "Syne", sans-serif;
      }
      .data-table tbody td {
        padding: 5px 8px;
        border-bottom: 1px solid rgba(54,48,42,0.3);
      }
      .data-table tbody tr:hover {
        background: rgba(45,39,34,0.5);
      }
      .data-table tbody tr:last-child td {
        border-bottom: none;
      }

      /* Smooth transitions */
      button, input, select, textarea {
        transition: all 0.15s ease;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }

      /* Card hover effects */
      .r1, .r2, .r3, .r4, .r5, .r6 {
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      .r1:hover, .r2:hover, .r3:hover, .r4:hover, .r5:hover, .r6:hover {
        transform: translateY(-2px);
        border-color: var(--amber);
      }

      @media (max-width: 900px) {
        .dash-grid { grid-template-columns: 1fr !important; }
        .research-grid { grid-template-columns: 1fr !important; }
        .metrics-grid { grid-template-columns: repeat(2,1fr) !important; }
        .nav-tabs { gap: 4px !important; }
        .nav-tab { font-size: 9px !important; padding: 6px 10px !important; }
        .dash-row-3 { grid-template-columns: 1fr !important; }
      }
      @media (max-width: 600px) {
        .metrics-grid { grid-template-columns: 1fr !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="error-banner"
      style="display:none;position:fixed;top:0;left:0;right:0;background:var(--coral);color:#fff;padding:12px 20px;font-family:'DM Mono',monospace;font-size:13px;z-index:99999;"
    ></div>
    <script>
      window.onerror = function (m, u, l, c, e) {
        var b = document.getElementById("error-banner");
        b.textContent = m + " at line " + l;
        b.style.display = "block";
      };
    </script>

    <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, Fragment } = React;

// ── Color Constants ──
const T = {
  deep: "#0f0e0c",
  surface: "#1a1714",
  card: "#231f1b",
  elevated: "#2d2722",
  border: "#36302a",
  borderLight: "#443d36",
  text: "#e6ddd4",
  secondary: "#a6978a",
  muted: "#73665a",
  amber: "#e8854a",
  amberDim: "#cc7540",
  teal: "#4a9e8c",
  tealDim: "#3a8a7a",
  sage: "#7ab86a",
  coral: "#d65d5d",
  gold: "#d8a84a",
};

const AGENTS = {
  analyst: { icon: "\u25C8", label: "Analyst", color: "#448aff" },
  strategist: { icon: "\u25C9", label: "Strategist", color: "#4a9e8c" },
  risk_manager: { icon: "\u25A3", label: "Risk Mgr", color: "#7ab86a" },
  curator: { icon: "\u25C7", label: "Curator", color: "#b388ff" },
  researcher: { icon: "\u25CB", label: "Researcher", color: "#d8a84a" },
};

const TABS = [
  { id: "research", label: "Research", icon: "\u27D0" },
  { id: "dashboard", label: "Dashboard", icon: "\u25C8" },
  { id: "strategies", label: "Strategies", icon: "\u25C9" },
  { id: "signals", label: "Signals", icon: "\u25CB" },
];

function uid() { return Math.random().toString(36).slice(2, 6); }
function fmtNum(n) { return n != null ? Number(n).toLocaleString() : "\u2014"; }
function pct(v) { return v != null ? (v * 100).toFixed(v < 0.1 ? 1 : 0) + "%" : "\u2014"; }
function fmtPnl(pnl) {
  if (pnl == null) return "\u2014";
  const n = typeof pnl === "number" ? pnl * 100 : pnl;
  return (n >= 0 ? "+" : "") + Number(n).toFixed(1) + "%";
}

// ── Skeleton Loader ──
function Skeleton({ width, height, style }) {
  return (
    <div
      className="skeleton"
      style={{ width: width || "100%", height: height || 16, ...(style || {}) }}
    />
  );
}

// ── MiniStat ──
function MiniStat({ label, value, color, small }) {
  return (
    <div
      style={{
        background: T.surface,
        borderRadius: "0 4px 0 4px",
        padding: small ? "4px 8px" : "6px 10px",
        border: `1px solid ${T.border}`,
      }}
    >
      <div
        style={{
          fontSize: small ? 7 : 8,
          color: T.muted,
          fontFamily: "'DM Mono',monospace",
          textTransform: "uppercase",
          letterSpacing: small ? "0.5px" : "1px",
          marginBottom: 1,
        }}
      >
        {label}
      </div>
      <div
        style={{
          fontSize: small ? 13 : 16,
          fontWeight: 700,
          color: color || T.text,
          fontFamily: "'DM Mono',monospace",
          lineHeight: 1.3,
        }}
      >
        {value}
      </div>
    </div>
  );
}

// ── App ──
function App() {
  const [tab, setTab] = useState("research");
  const [runId, setRunId] = useState(null);
  const [connected, setConnected] = useState(false);
  const [hypothesis, setHypothesis] = useState("");
  const [iteration, setIteration] = useState(0);
  const [maxIter, setMaxIter] = useState(5);
  const [metrics, setMetrics] = useState({});
  const [chartData, setChartData] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [goalInput, setGoalInput] = useState("Test SMA crossover for BTC/USDT");
  const [cycleInput, setCycleInput] = useState(3);
  const [iterInput, setIterInput] = useState(5);
  const [running, setRunning] = useState(false);
  const [timeline, setTimeline] = useState([]);
  const [log, setLog] = useState([]);
  const [tokens, setTokens] = useState({ total_tokens: 0 });
  const [sentiment, setSentiment] = useState(null);
  const logRef = useRef(null);
  const [mounted, setMounted] = useState(false);
  useEffect(() => { setMounted(true); }, []);

  // Dashboard state
  const [autonomousState, setAutonomousState] = useState(null);
  const [autoStarting, setAutoStarting] = useState(false);
  const [autoStopping, setAutoStopping] = useState(false);
  const [autoPausing, setAutoPausing] = useState(false);
  const [positions, setPositions] = useState([]);
  const [wsReconnect, setWsReconnect] = useState(0);
  const [circuitBreaker, setCircuitBreaker] = useState({ halted: false });
  const [regimeSnapshot, setRegimeSnapshot] = useState(null);
  const [iterationData, setIterationData] = useState({ results: [], discarded_count: 0, kept_count: 0, best_sharpe: 0 });
  const [signalsTabData, setSignalsTabData] = useState([]);
  const [strategyTabData, setStrategyTabData] = useState([]);
  const [startupStatus, setStartupStatus] = useState(null);
  const [riskPortfolio, setRiskPortfolio] = useState(null);
  const [dataHealth, setDataHealth] = useState(null);

  // Loading states
  const [loading, setLoading] = useState({
    autonomous: true, positions: true, strategies: true,
    circuit: true, regime: true, iterations: true,
    signals: true, startup: true, risk: true,
  });
  const [errors, setErrors] = useState({});

  // ── WebSocket for Research ──
  useEffect(() => {
    if (!runId) return;
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${window.location.host}/ws/run/${runId}`);
    ws.onopen = () => setConnected(true);
    ws.onmessage = (m) => {
      try { processEvent(JSON.parse(m.data)); } catch (e) { /* ignore parse errors */ }
    };
    ws.onclose = () => { setConnected(false); setTimeout(() => setWsReconnect(n => n + 1), 2000); };
    ws.onerror = () => setConnected(false);
    return () => ws.close();
  }, [runId, wsReconnect]);

  // ── WebSocket for Autonomous Loop (Dashboard live updates) ──
  const [autoWsReconnect, setAutoWsReconnect] = useState(0);
  useEffect(() => {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    let ws;
    let closed = false;
    function connect() {
      ws = new WebSocket(`${proto}//${window.location.host}/ws/autonomous`);
      ws.onmessage = (m) => {
        try { processEvent(JSON.parse(m.data)); } catch (e) { /* ignore parse errors */ }
      };
      ws.onclose = () => { if (!closed) setTimeout(() => setAutoWsReconnect(n => n + 1), 3000); };
      ws.onerror = () => ws.close();
    }
    connect();
    return () => { closed = true; if (ws) ws.close(); };
  }, [autoWsReconnect]);

  function processEvent(ev) {
    const { type, payload, timestamp } = ev;
    const ts = timestamp ? new Date(timestamp).toLocaleTimeString() : "";
    const entry = { type, payload, timestamp: ts, id: uid() };
    setLog((prev) => [...prev.slice(-99), entry]);
    switch (type) {
      case "hypothesis":
        setHypothesis(payload.hypothesis || "");
        setIteration(payload.iteration || 0);
        setMaxIter(payload.max_iterations || 5);
        break;
      case "critique":
        setHypothesis((prev) => prev + "\n\n\u2550 Critique \u2550\n" + (payload.critique || ""));
        break;
      case "iteration_result":
        setIteration(payload.iteration || 0);
        setMetrics(payload.metrics || {});
        if (payload.metrics)
          setChartData((prev) => [
            ...prev,
            {
              iter: payload.iteration,
              sharpe: payload.metrics.sharpe_ratio || 0,
              wr: payload.metrics.win_rate || 0,
              dd: Math.abs(payload.metrics.max_drawdown || 0),
            },
          ]);
        break;
      case "sentiment":
        if (payload) setSentiment(payload);
        break;
      case "task_done":
        setTimeline((prev) => [
          ...prev.slice(-99),
          {
            agent: payload.agent,
            task: (payload.description || "").slice(0, 120),
            time: ts,
            id: uid(),
          },
        ]);
        break;
      case "run_start":
        setRunning(true);
        setHypothesis("");
        setMetrics({});
        setIteration(0);
        setChartData([]);
        setTimeline([]);
        setLog([]);
        setSentiment(null);
        setTokens({ total_tokens: 0 });
        break;
      case "token_usage":
        setTokens(payload || { total_tokens: 0 });
        break;
      case "run_complete":
      case "run_error":
        setRunning(false);
        break;
      // Dashboard events
      case "autonomous_goal_generated":
        setAutonomousState((prev) => ({
          ...prev,
          current_goal: payload.motivation,
          last_regime: payload.regime,
        }));
        break;
      case "autonomous_cycle_complete":
        fetch("/api/autonomous/status").then(r=>r.json()).then(setAutonomousState).catch(()=>{});
        fetch("/api/regime/current").then(r=>r.json()).then(setRegimeSnapshot).catch(()=>{});
        break;
      case "strategy_decay_detected":
        setLog((prev) => [...prev.slice(-99), { type: "decay_alert", payload, time: ts, id: uid() }]);
        break;
      case "trade_signal_evaluated":
        setSignalsTabData((prev) => [...prev.slice(-199), { signal: payload, time: ts, id: uid() }]);
        break;
      case "trade_executed":
        setSignalsTabData((prev) => [...prev.slice(-199), { signal: { ...payload, type: "executed" }, time: ts, id: uid() }]);
        fetch("/api/positions/open").then(r=>r.json()).then(d=>setPositions(Array.isArray(d)?d:[])).catch(()=>{});
        break;
      case "anomaly_detected":
        setLog((prev) => [...prev.slice(-99), { type: "anomaly", payload, time: ts, id: uid() }]);
        break;
      case "circuit_breaker_triggered":
        setCircuitBreaker({ halted: true, reason: payload.reason });
        break;
      case "circuit_breaker_cleared":
        setCircuitBreaker({ halted: false });
        break;
    }
  }

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [log]);

  function startRun(goal) {
    if (!goal?.trim()) return;
    setShowModal(false);
    setRunning(true);
    setHypothesis("");
    setMetrics({});
    setIteration(0);
    setChartData([]);
    setTimeline([]);
    setLog([]);
    setSentiment(null);
    setTokens({ total_tokens: 0 });
    fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal, max_cycles: cycleInput, max_iterations: iterInput }),
    })
      .then((r) => r.json())
      .then((d) => { if (d.run_id) setRunId(d.run_id); })
      .catch(() => setRunning(false));
  }

  // ── Autonomous Actions ──
  function startAutonomous() {
    setAutoStarting(true);
    setLoading((p) => ({ ...p, autonomous: true }));
    fetch("/api/autonomous/start", { method: "POST" })
      .then((r) => r.json())
      .then((d) => {
        setAutoStarting(false);
        setAutonomousState((prev) => ({ ...prev, is_running: true }));
        setTimeout(pollAll, 500);
      })
      .catch(() => setAutoStarting(false));
  }
  function stopAutonomous() {
    setAutoStopping(true);
    fetch("/api/autonomous/stop", { method: "POST" })
      .then((r) => r.json())
      .then(() => {
        setAutoStopping(false);
        setAutonomousState((prev) => ({ ...prev, is_running: false }));
      })
      .catch(() => setAutoStopping(false));
  }
  function pauseAutonomous() {
    setAutoPausing(true);
    fetch("/api/autonomous/pause", { method: "POST" })
      .then((r) => r.json())
      .then(() => {
        setAutoPausing(false);
        setAutonomousState((prev) => ({ ...prev, is_paused: true, is_running: true }));
      })
      .catch(() => setAutoPausing(false));
  }
  function resumeAutonomous() {
    setAutoPausing(true);
    fetch("/api/autonomous/resume", { method: "POST" })
      .then((r) => r.json())
      .then(() => {
        setAutoPausing(false);
        setAutonomousState((prev) => ({ ...prev, is_paused: false, is_running: true }));
      })
      .catch(() => setAutoPausing(false));
  }

  function haltCircuitBreaker() {
    fetch("/api/circuit-breaker/halt?reason=Manual halt from UI", { method: "POST" })
      .then(r => r.json())
      .then(d => { setCircuitBreaker(d); })
      .catch(() => {});
  }
  function clearCircuitBreaker() {
    fetch("/api/circuit-breaker/clear", { method: "POST" })
      .then(r => r.json())
      .then(d => { setCircuitBreaker(d); })
      .catch(() => {});
  }

  // ── Dashboard Polling ──
  function pollAll() {
    const setLoaded = (key) => setLoading((p) => ({ ...p, [key]: false }));
    fetch("/api/autonomous/status").then(r=>r.json()).then(d=>{setAutonomousState(d);setLoaded("autonomous");}).catch((err)=>{setLoaded("autonomous");setErrors(prev=>({...prev,autonomous:err.message}));});
    fetch("/api/positions/open").then(r=>r.json()).then(d=>{setPositions(Array.isArray(d)?d:[]);setLoaded("positions");}).catch((err)=>{setLoaded("positions");setErrors(prev=>({...prev,positions:err.message}));});
    fetch("/api/strategies/deployable").then(r=>r.json()).then(d=>{const a=Array.isArray(d)?d:d.strategies||[];setLoaded("strategies");}).catch((err)=>{setLoaded("strategies");setErrors(prev=>({...prev,strategies:err.message}));});
    fetch("/api/circuit-breaker/status").then(r=>r.json()).then(d=>{setCircuitBreaker(d);setLoaded("circuit");}).catch((err)=>{setLoaded("circuit");setErrors(prev=>({...prev,circuit:err.message}));});
    fetch("/api/regime/current").then(r=>r.json()).then(d=>{setRegimeSnapshot(d);setLoaded("regime");}).catch((err)=>{setLoaded("regime");setErrors(prev=>({...prev,regime:err.message}));});
    fetch("/api/autonomous/iterations").then(r=>r.json()).then(d=>{setIterationData(d);setLoaded("iterations");}).catch((err)=>{setLoaded("iterations");setErrors(prev=>({...prev,iterations:err.message}));});
    fetch("/api/signals/feed").then(r=>r.json()).then(d=>{const a=Array.isArray(d)?d:d.signals||[];setSignalsTabData(a);setLoaded("signals");}).catch((err)=>{setLoaded("signals");setErrors(prev=>({...prev,signals:err.message}));});
    fetch("/api/startup/status").then(r=>r.json()).then(d=>{setStartupStatus(d);setLoaded("startup");}).catch((err)=>{setLoaded("startup");setErrors(prev=>({...prev,startup:err.message}));});
    fetch("/api/risk/portfolio").then(r=>r.json()).then(d=>{setRiskPortfolio(d);setLoaded("risk");}).catch((err)=>{setLoaded("risk");setErrors(prev=>({...prev,risk:err.message}));});
    fetch("/api/data/health").then(r=>r.json()).then(d=>{setDataHealth(d);}).catch(()=>{});
  }

  // Poll dashboard data every 10s
  useEffect(() => {
    if (tab !== "dashboard") return;
    pollAll();
    const iv = setInterval(pollAll, 10000);
    return () => clearInterval(iv);
  }, [tab]);

  // Fetch strategies data when on strategies tab
  useEffect(() => {
    if (tab !== "strategies") return;
    fetch("/api/strategies/deployable").then(r=>r.json()).then(d=>{
      const a = Array.isArray(d) ? d : d.strategies || [];
      setStrategyTabData(a);
    }).catch(()=>{});
  }, [tab]);

  // Fetch signals data when on signals tab
  useEffect(() => {
    if (tab !== "signals") return;
    const poll = () => {
      fetch("/api/signals/feed").then(r=>r.json()).then(d=>{
        const a = Array.isArray(d) ? d : d.signals || [];
        setSignalsTabData(a);
      }).catch(()=>{});
    };
    poll();
    const iv = setInterval(poll, 10000);
    return () => clearInterval(iv);
  }, [tab]);

  if (!mounted) return null;

  const isLive = running || autonomousState?.is_running;
  const isActive = isLive;
  const dotColor = isActive ? T.sage : connected ? T.teal : T.muted;
  const dotLabel = running ? "Running" : autonomousState?.is_running ? (autonomousState?.is_paused ? "Paused" : "Auto") : connected ? "Standby" : "Offline";

  return (
    <div
      style={{
        maxWidth: 1440,
        margin: "0 auto",
        padding: "0 24px",
        height: "100vh",
        display: "flex",
        flexDirection: "column",
      }}
    >
      {/* ── NavBar ── */}
      <NavBar
        tab={tab}
        setTab={setTab}
        dotColor={dotColor}
        dotLabel={dotLabel}
        tokens={tokens}
        circuitBreaker={circuitBreaker}
        running={running}
        autonomousState={autonomousState}
        startAutonomous={startAutonomous}
        stopAutonomous={stopAutonomous}
        autoStarting={autoStarting}
        autoStopping={autoStopping}
        pauseAutonomous={pauseAutonomous}
        resumeAutonomous={resumeAutonomous}
        autoPausing={autoPausing}
        setShowModal={setShowModal}
      />

      {/* ── Tab Content ── */}
      <div style={{ flex: 1, minHeight: 0, paddingTop: 12, overflow: "hidden" }}>
        {tab === "research" && (
          <ResearchView
            hypothesis={hypothesis}
            iteration={iteration}
            maxIter={maxIter}
            metrics={metrics}
            chartData={chartData}
            sentiment={sentiment}
            running={running}
            timeline={timeline}
            tokens={tokens}
            log={log}
            logRef={logRef}
            goalInput={goalInput}
            setGoalInput={setGoalInput}
            cycleInput={cycleInput}
            setCycleInput={setCycleInput}
            iterInput={iterInput}
            setIterInput={setIterInput}
            startRun={startRun}
          />
        )}
        {tab === "dashboard" && (
          <DashboardView
            autonomousState={autonomousState}
            circuitBreaker={circuitBreaker}
            regimeSnapshot={regimeSnapshot}
            positions={positions}
            tokens={tokens}
            iterationData={iterationData}
            loading={loading}
            startupStatus={startupStatus}
            riskPortfolio={riskPortfolio}
            dataHealth={dataHealth}
            startAutonomous={startAutonomous}
            stopAutonomous={stopAutonomous}
            pauseAutonomous={pauseAutonomous}
            resumeAutonomous={resumeAutonomous}
            autoStarting={autoStarting}
            autoStopping={autoStopping}
            autoPausing={autoPausing}
            haltCircuitBreaker={haltCircuitBreaker}
            clearCircuitBreaker={clearCircuitBreaker}
          />
        )}
        {tab === "strategies" && <StrategyLibraryView strategies={strategyTabData} />}
        {tab === "signals" && <SignalFeedView signals={signalsTabData} />}
      </div>

      {/* Error Status Bar */}
      {Object.keys(errors).length > 0 && (
        <div style={{position: 'fixed', bottom: 0, left: 0, right: 0, background: 'var(--coral)', color: '#fff', padding: '4px 16px', fontSize: 11, fontFamily: 'DM Mono', zIndex: 9999, display: 'flex', gap: 16}}>
          <span>⚠ API Errors: {Object.keys(errors).length}</span>
          {Object.entries(errors).slice(0, 3).map(([k, v]) => (
            <span key={k} style={{opacity: 0.8}}>{k}: {v}</span>
          ))}
        </div>
      )}

      {showModal && (
        <Modal
          goal={goalInput}
          setGoal={setGoalInput}
          cycles={cycleInput}
          setCycles={setCycleInput}
          iters={iterInput}
          setIters={setIterInput}
          onStart={startRun}
          onClose={() => setShowModal(false)}
        />
      )}
    </div>
  );
}

// NAVBAR

function NavBar({
  tab, setTab, dotColor, dotLabel, tokens, circuitBreaker,
  running, autonomousState, startAutonomous, stopAutonomous,
  autoStarting, autoStopping, pauseAutonomous, resumeAutonomous,
  autoPausing, setShowModal
}) {
  const isRunning = autonomousState?.is_running;
  const isPaused = autonomousState?.is_paused;
  return (
    <header className="nav-glass" style={{
      display: "flex",
      alignItems: "center",
      justifyContent: "space-between",
      padding: "0 4px",
      margin: "0 -24px",
      height: 48,
      flexShrink: 0,
      position: "sticky",
      top: 0,
      zIndex: 100,
    }}>
      {/* Logo + Status */}
      <div style={{ display: "flex", alignItems: "center", gap: 14, paddingLeft: 24 }}>
        <div style={{
          width: 30, height: 30,
          borderRadius: "0 6px 0 6px",
          border: `2px solid ${T.amber}`,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 14, fontWeight: 700, color: T.amber,
          fontFamily: "'Syne',sans-serif",
        }}>
          ⟐
        </div>
        <div>
          <h1 style={{
            fontFamily: "'Syne',sans-serif",
            fontSize: 14, fontWeight: 700,
            letterSpacing: "-0.3px", color: T.text,
            lineHeight: 1.2,
          }}>
            Crypto Agent Bot
          </h1>
          <div style={{
            fontSize: 9, color: T.muted,
            fontFamily: "'DM Mono',monospace",
            display: "flex", alignItems: "center", gap: 8,
          }}>
            <span style={{ color: dotColor, fontSize: 7 }}>●</span>
            <span>{dotLabel}</span>
            {tokens.total_tokens > 0 && (
              <span style={{ color: T.gold }}>◆ {tokens.total_tokens.toLocaleString()} tok</span>
            )}
          </div>
        </div>
      </div>

      {/* Tab Navigation */}
      <div className="nav-tabs" style={{
        display: "flex", alignItems: "center", gap: 2,
        height: "100%",
      }}>
        {TABS.map((t) => {
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                position: "relative",
                height: "100%",
                padding: "0 18px",
                background: "transparent",
                border: "none",
                cursor: "pointer",
                fontSize: 10,
                fontWeight: active ? 700 : 500,
                fontFamily: "'Syne',sans-serif",
                color: active ? T.text : T.muted,
                textTransform: "uppercase",
                letterSpacing: "2px",
                display: "flex",
                alignItems: "center",
                gap: 6,
                opacity: active ? 1 : 0.6,
              }}
            >
              <span style={{ fontSize: 9, color: active ? T.amber : T.muted }}>{t.icon}</span>
              {t.label}
              {active && (
                <div style={{
                  position: "absolute",
                  bottom: 0, left: "10%", right: "10%",
                  height: 2,
                  background: `linear-gradient(90deg,transparent,${T.amber},transparent)`,
                  borderRadius: "1px 1px 0 0",
                }} />
              )}
            </button>
          );
        })}
      </div>

      {/* Action Controls */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, paddingRight: 24 }}>
        {/* Circuit Breaker Alert */}
        {circuitBreaker?.halted && (
          <div style={{
            display: "flex", alignItems: "center", gap: 4,
            padding: "4px 10px",
            background: `${T.coral}15`,
            border: `1px solid ${T.coral}30`,
            borderRadius: "0 4px 0 4px",
          }}>
            <div style={{
              width: 6, height: 6, borderRadius: "50%",
              background: T.coral,
              animation: "pulse 1.5s ease-in-out infinite",
            }} />
            <span style={{ fontSize: 9, color: T.coral, fontFamily: "'DM Mono',monospace", fontWeight: 600 }}>
              HALTED
            </span>
          </div>
        )}

        {/* Auto Start/Stop */}
        {!isRunning ? (
          <button
            onClick={startAutonomous}
            disabled={autoStarting || running}
            style={{
              padding: "5px 12px",
              borderRadius: "0 4px 0 4px",
              background: autoStarting ? T.gold : "transparent",
              color: autoStarting ? "#000" : T.teal,
              border: `1px solid ${autoStarting ? T.gold : T.teal}`,
              cursor: (autoStarting || running) ? "not-allowed" : "pointer",
              fontSize: 9,
              fontWeight: 700,
              fontFamily: "'Syne',sans-serif",
              textTransform: "uppercase",
              letterSpacing: "1.5px",
              opacity: (autoStarting || running) ? 0.5 : 1,
            }}
          >
            {autoStarting ? "..." : "Start Auto"}
          </button>
        ) : (
          <div style={{ display: "flex", gap: 4 }}>
            {!isPaused ? (
              <button
                onClick={pauseAutonomous}
                disabled={autoPausing}
                style={{
                  padding: "5px 10px",
                  borderRadius: "0 4px 0 4px",
                  background: "transparent",
                  color: T.gold,
                  border: `1px solid ${T.gold}`,
                  cursor: autoPausing ? "not-allowed" : "pointer",
                  fontSize: 8,
                  fontWeight: 700,
                  fontFamily: "'Syne',sans-serif",
                  textTransform: "uppercase",
                  letterSpacing: "1px",
                  opacity: autoPausing ? 0.5 : 1,
                }}
              >
                Pause
              </button>
            ) : (
              <button
                onClick={resumeAutonomous}
                disabled={autoPausing}
                style={{
                  padding: "5px 10px",
                  borderRadius: "0 4px 0 4px",
                  background: "transparent",
                  color: T.sage,
                  border: `1px solid ${T.sage}`,
                  cursor: autoPausing ? "not-allowed" : "pointer",
                  fontSize: 8,
                  fontWeight: 700,
                  fontFamily: "'Syne',sans-serif",
                  textTransform: "uppercase",
                  letterSpacing: "1px",
                  opacity: autoPausing ? 0.5 : 1,
                }}
              >
                Resume
              </button>
            )}
            <button
              onClick={stopAutonomous}
              disabled={autoStopping}
              style={{
                padding: "5px 10px",
                borderRadius: "0 4px 0 4px",
                background: "transparent",
                color: T.coral,
                border: `1px solid ${T.coral}`,
                cursor: autoStopping ? "not-allowed" : "pointer",
                fontSize: 8,
                fontWeight: 700,
                fontFamily: "'Syne',sans-serif",
                textTransform: "uppercase",
                letterSpacing: "1px",
                opacity: autoStopping ? 0.5 : 1,
              }}
            >
              Stop
            </button>
          </div>
        )}

        <button
          onClick={() => setShowModal(true)}
          disabled={running}
          style={{
            padding: "5px 12px",
            borderRadius: "0 4px 0 4px",
            background: T.amber,
            color: "#000",
            border: `1px solid ${T.amber}`,
            cursor: running ? "not-allowed" : "pointer",
            fontSize: 9,
            fontWeight: 700,
            fontFamily: "'Syne',sans-serif",
            textTransform: "uppercase",
            letterSpacing: "1.5px",
            opacity: running ? 0.4 : 1,
            marginLeft: 2,
          }}
        >
          + New Run
        </button>
      </div>
    </header>
  );
}

function ResearchView({
  hypothesis, iteration, maxIter, metrics, chartData,
  sentiment, running, timeline, tokens, log, logRef,
  goalInput, setGoalInput, cycleInput, setCycleInput,
  iterInput, setIterInput, startRun,
}) {
  const hasM = metrics && Object.keys(metrics).length > 0;

    <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column", gap: 10 }}>
      {/* 3-col grid */}
      <div className="research-grid" style={{
        flex: 1, minHeight: 0,
        display: "grid",
        gridTemplateColumns: "210px 1fr 190px",
        gap: 10,
      }}>
        {/* Left: Timeline Panel */}
        <div className="r1" style={{ overflow: "hidden" }}>
          <TimelinePanel events={timeline} />
        </div>

        {/* Center: Hypothesis + Chart + Metrics */}
        <div className="r2" style={{ display: "flex", flexDirection: "column", gap: 8, overflow: "hidden" }}>
          {/* Hypothesis Card */}
          <div style={{
            background: T.card,
            borderRadius: "0 8px 0 8px",
            border: `1px solid ${T.border}`,
            flexShrink: 0,
            maxHeight: 150,
            overflowY: "auto",
            position: "relative",
          }}>
            <div style={{
              position: "absolute", top: 12, left: 0,
              width: 3, height: 26,
              background: T.amber,
              borderRadius: "0 2px 2px 0",
            }} />
            <div style={{ padding: "10px 16px 10px 22px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                <h2 style={{
                  fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600,
                  color: T.muted, textTransform: "uppercase", letterSpacing: "2px",
                }}>
                  Hypothesis
                </h2>
                {iteration > 0 && (
                  <span style={{
                    fontSize: 8, fontWeight: 600,
                    padding: "1px 8px",
                    borderRadius: "0 4px 0 4px",
                    background: `${T.amber}15`,
                    color: T.amber,
                    fontFamily: "'DM Mono',monospace",
                  }}>
                    IT {iteration}/{maxIter}
                  </span>
                )}
              </div>
              {hypothesis ? (
                <pre style={{
                  fontSize: 11, color: T.text, lineHeight: 1.7,
                  fontFamily: "'DM Mono',monospace", whiteSpace: "pre-wrap",
                }}>
                  {hypothesis}
                </pre>
              ) : (
                <div style={{ fontSize: 11, color: T.muted, fontStyle: "italic" }}>
                  {running ? "Generating hypothesis..." : "No hypothesis yet."}
                </div>
              )}
            </div>
          </div>

          {/* Metrics Grid */}
          <div className="metrics-grid" style={{
            display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 6,
            flexShrink: 0,
          }}>
            <MetricBox label="Sharpe" value={hasM ? metrics.sharpe_ratio?.toFixed(2) : "\u2014"} color={T.amber} />
            <MetricBox label="Win Rate" value={hasM && metrics.win_rate != null ? `${(metrics.win_rate * 100).toFixed(0)}%` : "\u2014"} color={T.sage} />
            <MetricBox label="Max DD" value={hasM && metrics.max_drawdown != null ? `${(Math.abs(metrics.max_drawdown) * 100).toFixed(1)}%` : "\u2014"} color={T.coral} />
            <MetricBox label="Trades" value={hasM ? metrics.total_trades : "\u2014"} color={T.teal} />
            <SentimentBox sentiment={sentiment} />
          </div>

          {/* Chart */}
          <div style={{
            flex: 1, minHeight: 80,
            background: T.card,
            borderRadius: "0 8px 0 8px",
            border: `1px solid ${T.border}`,
            padding: "10px 16px",
            position: "relative",
          }}>
            <div style={{
              position: "absolute", top: 12, left: 0,
              width: 3, height: 20,
              background: T.teal,
              borderRadius: "0 2px 2px 0",
            }} />
            <h2 style={{
              fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600,
              color: T.muted, textTransform: "uppercase", letterSpacing: "2px",
              marginBottom: 4, paddingLeft: 10,
            }}>
              Sharpe Progress
            </h2>
            {chartData.length === 0 ? (
              <div style={{
                display: "flex", alignItems: "center", justifyContent: "center",
                height: "calc(100% - 24px)",
              }}>
                <div style={{ fontSize: 10, color: T.muted }}>
                  {running ? "Waiting for data..." : "No iterations yet"}
                </div>
              </div>
            ) : (
              <Chart data={chartData} xKey="iter" yKey="sharpe" color={T.amber} />
            )}
          </div>
        </div>

        {/* Right: Stats Panel */}
        <div className="r3" style={{ overflow: "hidden" }}>
          <StatsPanel chartData={chartData} tokens={tokens} />
        </div>
      </div>

      {/* Run Controls */}
      <RunControls
        goal={goalInput} setGoal={setGoalInput}
        cycles={cycleInput} setCycles={setCycleInput}
        iters={iterInput} setIters={setIterInput}
        onStart={startRun}
        running={running}
      />

      {/* Log Panel */}
      <LogPanel events={log} ref={logRef} />

  );
}

function MetricBox({ label, value, color }) {
  return (
    <div style={{
      background: T.card,
      borderRadius: "0 6px 0 6px",
      border: `1px solid ${T.border}`,
      padding: "8px 8px",
      textAlign: "center",
      position: "relative",
      overflow: "hidden",

      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: 1.5,

        fontSize: 8, color: T.muted,

      </div>
      <div style={{ fontSize: 15, fontWeight: 700, color, fontFamily: "'DM Mono',monospace" }}>
        {value}

function SentimentBox({ sentiment }) {
  const bias = sentiment?.bias || "NEUTRAL";
  const fg = sentiment?.fear_greed;
  const c = bias === "bullish" ? T.sage : bias === "bearish" ? T.coral : T.muted;
  return (
    <div style={{
      background: T.card,
      borderRadius: "0 6px 0 6px",
      border: `1px solid ${T.border}`,
      padding: "8px 8px",
      textAlign: "center",
      position: "relative",
      overflow: "hidden",
    }}>
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: 1.5,
        background: c, opacity: 0.4,
      }} />
      <div style={{
        fontSize: 8, color: T.muted,
        textTransform: "uppercase", letterSpacing: "1.5px",
        marginBottom: 2, fontWeight: 500,
        fontFamily: "'Syne',sans-serif",
      }}>
        Sentiment
      </div>
      <div style={{
        fontSize: 12, fontWeight: 700, color: c,
        fontFamily: "'DM Mono',monospace", letterSpacing: "1px",
      }}>
        {bias}
      </div>
      {fg && (
        <div style={{ fontSize: 7, color: T.muted, marginTop: 1, fontFamily: "'DM Mono',monospace" }}>
          {fg.value} {fg.classification}
        </div>
      )}
    </div>
  );
}

function RunControls({ goal, setGoal, cycles, setCycles, iters, setIters, onStart, running }) {
  return (
    <div style={{
      background: T.card,
      borderRadius: "0 6px 0 6px",
      border: `1px solid ${T.border}`,
      padding: "8px 14px",
      display: "flex", alignItems: "center", gap: 10,
      flexShrink: 0,
    }}>
      <input type="text" value={goal} onChange={e => setGoal(e.target.value)}
        placeholder="Research goal..." disabled={running}
        style={{
          flex: 1, padding: "5px 10px", borderRadius: "0 4px 0 4px",
          background: T.surface, border: `1px solid ${T.border}`, color: T.text,
          fontSize: 10, fontFamily: "'DM Mono',monospace", outline: "none",
        }} />
      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
        <label style={{ fontSize: 8, color: T.muted, fontFamily: "'DM Mono',monospace" }}>Cycles</label>
        <input type="number" min={1} max={10} value={cycles}
          onChange={e => setCycles(Number(e.target.value))} disabled={running}
          style={{
            width: 48, padding: "4px 6px", borderRadius: "0 4px 0 4px",
            background: T.surface, border: `1px solid ${T.border}`, color: T.text,
            fontSize: 10, fontFamily: "'DM Mono',monospace", outline: "none", textAlign: "center",
          }} />
        <label style={{ fontSize: 8, color: T.muted, fontFamily: "'DM Mono',monospace" }}>Iters</label>
        <input type="number" min={1} max={10} value={iters}
          onChange={e => setIters(Number(e.target.value))} disabled={running}
          style={{
            width: 48, padding: "4px 6px", borderRadius: "0 4px 0 4px",
            background: T.surface, border: `1px solid ${T.border}`, color: T.text,
            fontSize: 10, fontFamily: "'DM Mono',monospace", outline: "none", textAlign: "center",
          }} />
        <button onClick={() => onStart(goal)} disabled={running || !goal?.trim()}
          style={{
            padding: "5px 14px", borderRadius: "0 4px 0 4px",
            background: running || !goal?.trim() ? T.muted : T.amber,
            color: "#000",
            border: `1px solid ${running || !goal?.trim() ? T.muted : T.amber}`,

          }}>

        </button>
      </div>
    </div>
  );
}

function Chart({ data, xKey, yKey, color }) {
  const w = 700, h = 120, pl = 40, pr = 14, pt = 6, pb = 20;
  const cw = w - pl - pr, ch = h - pt - pb;
  const xV = data.map((d) => d[xKey]), yV = data.map((d) => d[yKey] || 0);
  const xM = Math.min(...xV), xX = Math.max(...xV);
  const yM = Math.min(...yV), yX = Math.max(...yV);
  const xR = xX - xM || 1, yR = yX - yM || 1;
  const pts = data.map((d) => ({
    x: pl + ((d[xKey] - xM) / xR) * cw,
    y: pt + ch - (((d[yKey] || 0) - yM) / yR) * ch,
  }));
  const ln = pts.map((p) => `${p.x},${p.y}`).join(" ");
  const fl = pts.map((p) => `${p.x},${p.y}`).join(" ");
  const bs = `${pl},${pt + ch} ${pl + cw},${pt + ch}`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "100%", display: "block" }}>
      <defs>
        <linearGradient id={`af-${color.replace("#","")}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18" />
          <stop offset="100%" stopColor={color} stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75].map((f, i) => (
        <line key={i} x1={pl} y1={pt + ch * f} x2={pl + cw} y2={pt + ch * f}
          stroke={T.border} strokeWidth="1" strokeDasharray="3 3" />
      ))}
      <polygon points={`${fl} ${bs}`} fill={`url(#af-${color.replace("#","")})`} />
      <polyline points={ln} fill="none" stroke={color} strokeWidth="2"
        strokeLinejoin="round" strokeLinecap="round" />
      {pts.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="2.5" fill={color} stroke={T.card} strokeWidth="1.5" />
      ))}
      {pts.length > 0 && (() => {
        const last = pts[pts.length - 1];
        return <circle cx={last.x} cy={last.y} r="5" fill={`${color}25`} />;
      })()}
      <text x={pl - 4} y={pt + 4} fill={T.muted} fontSize="8" textAnchor="end" fontFamily="DM Mono">
        {yX.toFixed(2)}
      </text>
      <text x={pl - 4} y={pt + ch + 4} fill={T.muted} fontSize="8" textAnchor="end" fontFamily="DM Mono">
        {yM.toFixed(2)}
      </text>
      <text x={pl} y={h - 2} fill={T.muted} fontSize="8" fontFamily="DM Mono">{xM}</text>
      <text x={w - pr} y={h - 2} fill={T.muted} fontSize="8" textAnchor="end" fontFamily="DM Mono">{xX}</text>
    </svg>
  );
}

            <div style={{ textAlign: "center", padding: 20 }}>
              <div style={{ fontSize: 10, color: T.muted }}>No open positions</div>
              <div style={{ fontSize: 8, color: T.muted, marginTop: 4 }}>
                Signals will appear when opportunities are detected
              </div>
            </div>
          ) : (
            <div style={{ flex: 1, overflowY: "auto" }}>
              <table className="data-table" style={{ fontSize: 9.5 }}>
                <thead>
                  <tr>
                    <th>Pair</th><th>Side</th><th>Size</th><th>Entry</th><th>PnL</th><th>Duration</th>
                  </tr>
                </thead>
                <tbody>
                  {positions.map((p, i) => (
                    <tr key={i}>
                      <td style={{ padding: "4px 6px", color: T.text, fontWeight: 600 }}>{p.pair || "\u2014"}</td>
                      <td style={{
                        padding: "4px 6px",
                        color: p.side === "buy" || p.side === "long" ? T.sage : T.coral,
                        fontWeight: 600,
                      }}>
                        {(p.side || "\u2014").toUpperCase()}
                      </td>
                      <td style={{ padding: "4px 6px", color: T.text }}>{p.size || "\u2014"}</td>
                      <td style={{ padding: "4px 6px", color: T.text }}>
                        {p.entry_price ? `$${p.entry_price}` : "\u2014"}
                      </td>
                      <td style={{
                        padding: "4px 6px",
                        color: (p.pnl_pct || 0) >= 0 ? T.sage : T.coral,
                        fontWeight: 600,
                      }}>
                        {fmtPnl(p.pnl_pct)}
                      </td>
                      <td style={{ padding: "4px 6px", color: T.muted }}>
                        {p.entry_time ? new Date(p.entry_time).toLocaleTimeString() : "\u2014"}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )
        ))}
      </div>

      {/* ── Row 2: Portfolio, Startup, Data Health ── */}
      <div className="dash-row-3" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 10 }}>
        {/* Portfolio Risk */}
        <div className="r5" style={{
          background: T.card, borderRadius: "0 8px 0 8px",
          border: `1px solid ${T.border}`, padding: 14,
          position: "relative",
        }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: `linear-gradient(90deg,${T.gold},transparent)` }} />
          <h2 style={{ fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600, color: T.muted, textTransform: "uppercase", letterSpacing: "2px", marginBottom: 10 }}>
            Portfolio Risk
          </h2>
          {riskPortfolio ? (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
              <MiniStat label="Open" value={riskPortfolio.total_open_positions ?? "\u2014"} color={T.teal} small />
              <MiniStat label="Daily PnL" value={fmtPnl(riskPortfolio.daily_pnl_pct)} color={(riskPortfolio.daily_pnl_pct||0) >= 0 ? T.sage : T.coral} small />
              <MiniStat label="Weekly PnL" value={fmtPnl(riskPortfolio.weekly_pnl_pct)} color={(riskPortfolio.weekly_pnl_pct||0) >= 0 ? T.sage : T.coral} small />
              <MiniStat label="Max DD" value={riskPortfolio.max_drawdown != null ? `${(Math.abs(riskPortfolio.max_drawdown)*100).toFixed(1)}%` : "\u2014"} color={T.coral} small />
            </div>
          ) : (
            <div style={{ fontSize: 10, color: T.muted }}>Waiting for data...</div>
          )}
        </div>

        {/* Startup Status */}
        <div className="r5" style={{
          background: T.card, borderRadius: "0 8px 0 8px",
          border: `1px solid ${T.border}`, padding: 14,
          position: "relative",
        }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: `linear-gradient(90deg,${T.sage},transparent)` }} />
          <h2 style={{ fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600, color: T.muted, textTransform: "uppercase", letterSpacing: "2px", marginBottom: 10 }}>
            Startup Tasks
          </h2>
          {startupStatus?.tasks ? (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4 }}>
              {Object.entries(startupStatus.tasks).map(([k, t]) => {
                const c = t.status === "running" ? T.sage : t.status === "failed" ? T.coral : t.status === "stopped" ? T.muted : T.gold;
                return (
                  <div key={k} style={{ padding: "4px 8px", background: T.surface, borderRadius: 4, border: `1px solid ${T.border}` }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 4 }}>
                      <span style={{ fontSize: 7, color: T.muted, fontFamily: "'DM Mono',monospace", textTransform: "uppercase", letterSpacing: "0.5px" }}>
                        {k.replace(/_/g, " ")}
                      </span>
                      <span style={{ fontSize: 7, color: c, fontFamily: "'DM Mono',monospace", fontWeight: 600, flexShrink: 0 }}>
                        {t.status}
                      </span>
                    </div>
                    {t.error && <div style={{ fontSize: 7, color: T.coral, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.error}</div>}
                  </div>
                );
              })}
            </div>
          ) : (
            <div style={{ fontSize: 10, color: T.muted }}>No startup data</div>
          )}
        </div>

        {/* Data Health */}
        <div className="r6" style={{
          background: T.card, borderRadius: "0 8px 0 8px",
          border: `1px solid ${T.border}`, padding: 14,
          position: "relative",
        }}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: `linear-gradient(90deg,${T.teal},transparent)` }} />
          <h2 style={{ fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600, color: T.muted, textTransform: "uppercase", letterSpacing: "2px", marginBottom: 10 }}>
            Data Sources
          </h2>
          {dataHealth && Object.keys(dataHealth).length > 0 ? (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4 }}>
              {Object.entries(dataHealth).slice(0, 6).map(([name, s]) => {
                const h = s.is_healthy !== false;
                return (
                  <div key={name} style={{ padding: "4px 8px", background: T.surface, borderRadius: 4, border: `1px solid ${T.border}` }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <span style={{ fontSize: 7, color: T.muted, fontFamily: "'DM Mono',monospace", textTransform: "uppercase", letterSpacing: "0.5px" }}>{name.replace(/_/g, " ")}</span>
                      <span style={{ fontSize: 7, color: h ? T.sage : T.coral }}>{h ? "OK" : "DOWN"}</span>
                    </div>
                    {s.last_success && <div style={{ fontSize: 7, color: T.muted, marginTop: 1 }}>{new Date(s.last_success).toLocaleTimeString()}</div>}
                  </div>
                );
              })}
            </div>
          ) : (
            <div style={{ fontSize: 10, color: T.muted }}>No source data</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════
// STRATEGY LIBRARY VIEW
// ════════════════════════════════════════════
function StrategyLibraryView({ strategies }) {
  const [search, setSearch] = useState("");
  const [regimeFilter, setRegimeFilter] = useState("all");

  const regimes = useMemo(() => {
    const s = new Set();
    (strategies||[]).forEach(r => { if (r.regime) s.add(r.regime); });
    return ["all", ...Array.from(s)];
  }, [strategies]);

  const filtered = useMemo(() => {
    let items = strategies || [];
    if (search.trim()) {
      const q = search.toLowerCase();
      items = items.filter((s) =>
        (s.strategy_type || s.name || "").toLowerCase().includes(q) ||
        (s.regime || s.metadata?.regime || "").toLowerCase().includes(q)
      );
    }
    if (regimeFilter !== "all") items = items.filter(s => s.regime === regimeFilter);
    return items;
  }, [strategies, search, regimeFilter]);

  return (
    <div className="r1" style={{
      flex: 1, minHeight: 0,
      overflow: "hidden",
      display: "flex",
      flexDirection: "column",
      background: T.card,
      borderRadius: "0 8px 0 8px",
      border: `1px solid ${T.border}`,
      padding: 14,
      position: "relative",
    }}>
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: 2,
        background: `linear-gradient(90deg,${T.teal},transparent)`,
      }} />

      {/* Header + Search */}
      <div style={{
        display: "flex", alignItems: "center",
        justifyContent: "space-between", gap: 12,
        marginBottom: 10, flexShrink: 0,
      }}>
        <h2 style={{
          fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600,
          color: T.muted, textTransform: "uppercase", letterSpacing: "2px",
        }}>
          Strategy Library ({filtered.length})
        </h2>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <input
            type="text"
            placeholder="Filter strategies..."
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            style={{
              width: 140,
              padding: "6px 10px",
              borderRadius: "0 4px 0 4px",
              background: T.surface,
              border: `1px solid ${T.border}`,
              color: T.text,
              fontSize: 10,
              fontFamily: "'DM Mono',monospace",
              outline: "none",
            }}
          />
          <select
            value={regimeFilter}
            onChange={e => setRegimeFilter(e.target.value)}
            style={{
              padding: "6px 10px",
              borderRadius: "0 4px 0 4px",
              background: T.surface,
              border: `1px solid ${T.border}`,
              color: T.text,
              fontSize: 10,
              fontFamily: "'DM Mono',monospace",
              cursor: "pointer",
              outline: "none",
            }}
          >
            {regimes.map(r => (
              <option key={r} value={r}>{r === "all" ? "All Regimes" : r.replace(/_/g, " ")}</option>
            ))}
          </select>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div style={{ textAlign: "center", padding: 40, flex: 1 }}>
          <div style={{ fontSize: 24, color: T.muted, opacity: 0.2, marginBottom: 8 }}>◉</div>
          <div style={{ fontSize: 11, color: T.muted }}>
            {strategies.length === 0
              ? "No deployable strategies yet"
              : "No strategies match your filter"}
          </div>
          <div style={{ fontSize: 9, color: T.muted, marginTop: 4 }}>
            Run autonomous research to discover strategies
          </div>
        </div>
      ) : (
        <div style={{ flex: 1, overflowY: "auto" }}>
          <table className="data-table">
            <thead>
              <tr>
                <th>Name</th><th>Type</th><th>Regime</th><th>Sharpe</th><th>Win Rate</th><th>Max DD</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((s, i) => {
                const sharpe = s.sharpe || s.metadata?.sharpe || 0;
                const wr = s.win_rate || s.metadata?.win_rate || 0;
                const dd = Math.abs(s.max_drawdown || s.metadata?.max_drawdown || 0);
                const name = s.strategy_type || s.name || "Unnamed";
                const type = s.strategy_type || "\u2014";
                const regime = s.regime || s.metadata?.regime || "\u2014";
                const status = dd > 0.1 ? "\u26A0 Decaying" : "\u25CF Active";
                return (
                  <tr key={i}>
                    <td style={{ padding: "5px 8px", color: T.text, fontWeight: 600, fontSize: 10 }}>
                      {name}
                    </td>
                    <td style={{ padding: "5px 8px", color: T.secondary }}>{type}</td>
                    <td style={{ padding: "5px 8px", color: T.amber }}>{regime}</td>
                    <td style={{
                      padding: "5px 8px",
                      color: sharpe >= 0.8 ? T.sage : sharpe >= 0 ? T.text : T.coral,
                      fontWeight: 700,
                    }}>
                      {typeof sharpe === "number" ? sharpe.toFixed(2) : "\u2014"}
                    </td>
                    <td style={{ padding: "5px 8px", color: T.text }}>
                      {typeof wr === "number" ? `${(wr * 100).toFixed(0)}%` : "\u2014"}
                    </td>
                    <td style={{
                      padding: "5px 8px",
                      color: dd < 0.05 ? T.sage : dd < 0.1 ? T.gold : T.coral,
                    }}>
                      {typeof dd === "number" ? `${(dd * 100).toFixed(1)}%` : "\u2014"}
                    </td>
                    <td style={{
                      padding: "5px 8px",
                      color: status.includes("Active") ? T.sage : T.gold,
                      fontWeight: 600,
                    }}>
                      {status}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════
// SIGNAL FEED VIEW
// ════════════════════════════════════════════
function SignalFeedView({ signals }) {
  const data = useMemo(() => {
    return Array.isArray(signals) ? [...signals].reverse().slice(0, 100) : [];
  }, [signals]);

  return (
    <div className="r1" style={{
      flex: 1, minHeight: 0,
      overflow: "hidden",
      display: "flex",
      flexDirection: "column",
      background: T.card,
      borderRadius: "0 8px 0 8px",
      border: `1px solid ${T.border}`,
      padding: 14,
      position: "relative",
    }}>
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: 2,
        background: `linear-gradient(90deg,${T.gold},transparent)`,
      }} />
      <h2 style={{
        fontFamily: "'Syne',sans-serif", fontSize: 9, fontWeight: 600,
        color: T.muted, textTransform: "uppercase", letterSpacing: "2px",
        marginBottom: 10, flexShrink: 0,
      }}>
        Signal Feed ({data.length})
      </h2>

      {data.length === 0 ? (
        <div style={{ textAlign: "center", padding: 40, flex: 1 }}>
          <div style={{ fontSize: 24, color: T.muted, opacity: 0.2, marginBottom: 8 }}>○</div>
          <div style={{ fontSize: 11, color: T.muted }}>No signals evaluated yet</div>
          <div style={{ fontSize: 9, color: T.muted, marginTop: 4 }}>
            Signals appear here when the scanner detects opportunities
          </div>
        </div>
      ) : (
        <div style={{ flex: 1, overflowY: "auto" }}>
          <table className="data-table">
            <thead>
              <tr>
                <th>Time</th><th>Pair</th><th>Signal</th><th>Strategy</th><th>Confidence</th><th>Regime</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              {data.map((s, i) => {
                const sig = s.signal || s;
                const isBuy = (sig.signal || "").toLowerCase() === "buy";
                const isSell = (sig.signal || "").toLowerCase() === "sell";
                const conf = sig.confidence != null ? sig.confidence : 0;
                const time = s.time || (sig.timestamp ? new Date(sig.timestamp).toLocaleTimeString() : "\u2014");
                return (
                  <tr key={s.id || i}>
                    <td style={{ padding: "4px 8px", color: T.muted, fontFamily: "'DM Mono',monospace", fontSize: 9 }}>
                      {time}
                    </td>
                    <td style={{ padding: "4px 8px", color: T.text, fontWeight: 600 }}>
                      {sig.pair || "\u2014"}
                    </td>
                    <td style={{ padding: "4px 8px" }}>
                      <span style={{
                        display: "inline-block",
                        padding: "1px 8px",
                        borderRadius: "0 4px 0 4px",
                        background: isBuy ? `${T.sage}20` : isSell ? `${T.coral}20` : `${T.muted}15`,
                        color: isBuy ? T.sage : isSell ? T.coral : T.muted,
                        fontWeight: 700,
                        fontSize: 9,
                        fontFamily: "'DM Mono',monospace",
                        textTransform: "uppercase",
                      }}>
                        {sig.signal || "hold"}
                      </span>
                    </td>
                    <td style={{ padding: "4px 8px", color: T.secondary }}>
                      {sig.strategy_type || "\u2014"}
                    </td>
                    <td style={{ padding: "4px 8px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <div style={{
                          width: 50,
                          height: 4,
                          background: T.surface,
                          borderRadius: 2,
                          overflow: "hidden",
                        }}>
                          <div style={{
                            width: `${Math.min(conf * 100, 100)}%`,
                            height: "100%",
                            background: conf >= 0.6 ? T.sage : conf >= 0.3 ? T.gold : T.muted,
                            borderRadius: 2,
                            transition: "width 0.3s",
                          }} />
                        </div>
                        <span style={{
                          fontSize: 9,
                          color: conf >= 0.6 ? T.sage : conf >= 0.3 ? T.gold : T.muted,
                          fontFamily: "'DM Mono',monospace",
                          fontWeight: 600,
                        }}>
                          {(conf * 100).toFixed(0)}%
                        </span>
                      </div>
                    </td>
                    <td style={{ padding: "4px 8px", color: T.amber, fontSize: 9 }}>
                      {sig.regime || "\u2014"}
                    </td>
                    <td style={{
                      padding: "4px 8px",
                      color: sig.type === "executed" ? T.sage : T.muted,
                      fontWeight: 600,
                      fontSize: 9,
                    }}>
                      {sig.type === "executed" ? "EXECUTED" : "EVALUATED"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════
function Modal({ goal, setGoal, cycles, setCycles, iters, setIters, onStart, onClose }) {
  const [input, setInput] = useState(goal);
  return (
    <div
      style={{
        position: "fixed", inset: 0, zIndex: 1000,
        display: "flex", alignItems: "center", justifyContent: "center",
        background: "rgba(0,0,0,0.75)",
        backdropFilter: "blur(4px)",
        WebkitBackdropFilter: "blur(4px)",
      }}
      onClick={onClose}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: 460,
          maxWidth: "90vw",
          animation: "stampIn 0.3s ease-out",
          background: T.card,
          borderRadius: "0 14px 0 14px",
          border: `1px solid ${T.border}`,
          padding: 28,
          position: "relative",
          overflow: "hidden",
        }}
      >
        {/* Corner accents */}
        <div style={{
          position: "absolute", top: 0, left: 0,
          width: 36, height: 36,
          borderTop: `2px solid ${T.amber}`,
          borderLeft: `2px solid ${T.amber}`,
        }} />
        <div style={{
          position: "absolute", bottom: 0, right: 0,
          width: 36, height: 36,
          borderBottom: `2px solid ${T.teal}`,
          borderRight: `2px solid ${T.teal}`,
        }} />

        <div style={{ marginBottom: 22 }}>
          <div style={{
            fontFamily: "'Syne',sans-serif",
            fontSize: 18, fontWeight: 700, color: T.text,
          }}>
            New Research Run
          </div>
          <p style={{ fontSize: 10, color: T.muted, marginTop: 4 }}>
            Configure research experiment parameters
          </p>
        </div>

        <label style={{
          fontSize: 9, color: T.muted, fontWeight: 600,
          display: "block", textTransform: "uppercase",
          letterSpacing: "1.5px", fontFamily: "'Syne',sans-serif",
          marginBottom: 4,
        }}>
          Goal
        </label>
        <textarea
          rows={3}
          value={input}
          onChange={(e) => setInput(e.target.value)}
          style={{
            width: "100%", resize: "vertical",
            fontFamily: "'Sora',sans-serif", fontSize: 11.5,
            padding: "10px 14px",
            borderRadius: "0 6px 0 6px",
            background: T.surface,
            border: `1px solid ${T.border}`,
            color: T.text,
            marginBottom: 18,
            outline: "none",
          }}
        />

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18, marginBottom: 24 }}>
          <div>
            <label style={{
              fontSize: 9, color: T.muted, fontWeight: 600,
              display: "block", textTransform: "uppercase",
              letterSpacing: "1.5px", fontFamily: "'Syne',sans-serif",
              marginBottom: 2,
            }}>
              Max Cycles: <span style={{ color: T.amber, fontFamily: "'DM Mono',monospace" }}>{cycles}</span>
            </label>
            <input type="range" min={1} max={10} value={cycles}
              onChange={e => setCycles(Number(e.target.value))}
              style={{ width: "100%", margin: "8px 0" }} />
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 8, color: T.muted, fontFamily: "'DM Mono',monospace" }}>
              <span>1</span><span>10</span>
            </div>
          </div>
          <div>
            <label style={{
              fontSize: 9, color: T.muted, fontWeight: 600,
              display: "block", textTransform: "uppercase",
              letterSpacing: "1.5px", fontFamily: "'Syne',sans-serif",
              marginBottom: 2,
            }}>
              Max Iterations: <span style={{ color: T.amber, fontFamily: "'DM Mono',monospace" }}>{iters}</span>
            </label>
            <input type="range" min={1} max={10} value={iters}
              onChange={e => setIters(Number(e.target.value))}
              style={{ width: "100%", margin: "8px 0" }} />
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 8, color: T.muted, fontFamily: "'DM Mono',monospace" }}>
              <span>1</span><span>10</span>
            </div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <button
            style={{
              padding: "8px 18px",
              borderRadius: "0 6px 0 6px",
              border: `1px solid ${T.border}`,
              background: T.elevated,
              color: T.text,
              fontSize: 11,
              fontWeight: 600,
              cursor: "pointer",
              fontFamily: "'Sora',sans-serif",
            }}
            onClick={onClose}
          >
            Cancel
          </button>
          <button
            style={{
              padding: "8px 18px",
              borderRadius: "0 6px 0 6px",
              border: `1px solid ${T.amber}`,
              background: T.amber,
              color: "#000",
              fontSize: 11,
              fontWeight: 700,
              cursor: "pointer",
              fontFamily: "'Syne',sans-serif",
              textTransform: "uppercase",
              letterSpacing: "1px",
            }}
            onClick={() => { setGoal(input); onStart(input); }}
          >
            Start Run
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);</script>
