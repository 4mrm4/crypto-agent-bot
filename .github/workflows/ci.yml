name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}"
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool
          # TA-Lib C library — not packaged for Ubuntu 24.04, build from source
          git clone --depth 1 https://github.com/ta-lib/ta-lib.git /tmp/ta-lib
          cd /tmp/ta-lib
          chmod +x autogen.sh
          ./autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)"
          sudo make install
          cd / && rm -rf /tmp/ta-lib
          python -m pip install --upgrade pip
          cd "$GITHUB_WORKSPACE"
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest --tb=short -q
