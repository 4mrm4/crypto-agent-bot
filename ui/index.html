<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>crypto_agent_bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html,body,#root{height:100%;width:100%}
body{background:#060A12;color:#E2EBF5;font-family:'Exo 2',sans-serif;font-size:13px;line-height:1.6;overflow:hidden}
:root{
  --bg:#060A12;--surface:#0C1220;--elevated:#111827;
  --border:#1E2D45;--border-bright:#2A4060;
  --text:#E2EBF5;--secondary:#7A95B0;--muted:#3D5470;
  --green:#00FF88;--green-dim:#003D22;
  --red:#FF3B5C;--red-dim:#3D0012;
  --amber:#FFB830;--amber-dim:#3D2A00;
  --blue:#3B82F6;--purple:#8B5CF6;--cyan:#06B6D4;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1E2D45}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#root{display:flex;flex-direction:column;height:100vh}
.main{display:flex;flex:1;min-height:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes slideUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes slideDown{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}@keyframes countUp{0%{opacity:0.6}100%{opacity:1}}
.scanline{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,0.015)2px,rgba(0,255,136,0.015)4px);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback} = React;

// ═══ THEME ═══
const T = {
  bg:"#060A12",surface:"#0C1220",elevated:"#111827",
  border:"#1E2D45",borderBright:"#2A4060",
  text:"#E2EBF5",secondary:"#7A95B0",muted:"#3D5470",
  accent:"#00FF88",coral:"#FF3B5C",teal:"#06B6D4",
  gold:"#FFB830",purple:"#8B5CF6",blue:"#3B82F6",
};

// ═══ UTILITIES ═══
const fmtPnl = (v) => v != null ? `${v >= 0 ? "+" : ""}${(v * 100).toFixed(2)}%` : "\u2014";
const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString() : "\u2014";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const agentColors = {strategist:T.purple,analyst:T.cyan,risk_manager:T.gold,backtester:T.muted,researcher:T.blue};

// ═══ MOCK DATA GENERATORS ═══
function generateMockCandles(n = 120) {
  const candles = []; let price = 45000;
  const start = Date.now() - n * 3600000;
  for (let i = 0; i < n; i++) {
    const change = (Math.random() - 0.48) * price * 0.015;
    const open = price; const close = price + change;
    const high = Math.max(open, close) + Math.random() * price * 0.005;
    const low = Math.min(open, close) - Math.random() * price * 0.005;
    candles.push({time: start + i * 3600000, open, high, low, close, volume: Math.random() * 100 + 20});
    price = close;
  }
  return candles;
}
function generateMockTrades(candles) {
  const trades = [];
  for (let i = 10; i < candles.length - 10; i += Math.floor(Math.random() * 15 + 8)) {
    const exitIdx = Math.min(i + Math.floor(Math.random() * 8 + 2), candles.length - 1);
    const profit = (Math.random() - 0.4) * 0.06;
    trades.push({open_date: candles[i].time, close_date: candles[exitIdx].time, open_rate: candles[i].close, close_rate: candles[exitIdx].close, profit_ratio: profit, is_short: false});
  }
  return trades;
}

// ═══ SVG ARC PATH HELPER ═══
function arcPath(cx, cy, r, startAngle, endAngle) {
  const s = {x: cx + r * Math.cos(startAngle), y: cy + r * Math.sin(startAngle)};
  const e = {x: cx + r * Math.cos(endAngle), y: cy + r * Math.sin(endAngle)};
  const large = endAngle - startAngle > Math.PI ? 1 : 0;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y}`;
}

// ═══ SVG GAUGE: Sharpe ═══
function SharpeGauge({value}) {
  const clamped = Math.max(-3, Math.min(3, value || 0));
  const pct = (clamped + 3) / 6;
  const color = clamped < 0 ? T.coral : clamped < 0.8 ? T.gold : T.accent;
  const cx = 100, cy = 100, r = 72;
  const sA = -Math.PI * 0.8, sW = Math.PI * 1.6;
  const fillAngle = sA + sW * pct;
  const labelX = cx;
  const glow = `0 0 10px ${color}`;
  return (
    <svg viewBox="0 0 200 130" style={{width:"100%"}}>
      <path d={arcPath(cx,cy,r,sA,sA+sW)} stroke={T.border} strokeWidth="8" fill="none" strokeLinecap="butt" />
      <path d={arcPath(cx,cy,r,sA,fillAngle)} stroke={color} strokeWidth="8" fill="none" strokeLinecap="butt" />
      {[-1,0,0.8,2].map(tk => {
        const tp = (tk + 3) / 6;
        const ta = sA + sW * tp;
        const tx = cx + (r + 12) * Math.cos(ta);
        const ty = cy + (r + 12) * Math.sin(ta);
        return <text key={tk} x={tx} y={ty} textAnchor="middle" dominantBaseline="middle" fill={T.muted} fontFamily="DM Mono" fontSize="7">{tk}</text>;
      })}
      <text x={labelX} y={86} textAnchor="middle" fontFamily="DM Mono" fontSize="22" fontWeight="500" fill={color} style={{textShadow:glow}}>
        {value != null ? value.toFixed(2) : "0.00"}
      </text>
      <text x={labelX} y={104} textAnchor="middle" fontFamily="Orbitron" fontSize="7" fill={T.secondary} letterSpacing="3">SHARPE</text>
    </svg>
  );
}

// ═══ SVG GAUGE: Win Rate Donut ═══
function WinRateDonut({value}) {
  const wr = Math.max(0, Math.min(1, value || 0));
  const r = 48, cx = 70, cy = 70;
  const circ = 2 * Math.PI * r;
  const fillLen = circ * wr;
  return (
    <svg viewBox="0 0 140 120" style={{width:"100%"}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={T.border} strokeWidth="10" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={T.accent} strokeWidth="10" strokeDasharray={`${fillLen} ${circ}`} strokeLinecap="butt" transform={`rotate(-90 ${cx} ${cy})`} style={{transition:"stroke-dashoffset 0.5s"}} />
      <text x={cx} y={cy+4} textAnchor="middle" fontFamily="DM Mono" fontSize="16" fontWeight="500" fill={T.accent} style={{textShadow:"0 0 8px var(--green)"}}>{(wr*100).toFixed(0)}%</text>
      <text x={cx} y={100} textAnchor="middle" fontFamily="Orbitron" fontSize="7" fill={T.secondary} letterSpacing="3">WIN RATE</text>
    </svg>
  );
}

// ═══ SVG GAUGE: Max Drawdown Bar ═══
function DrawdownBar({value}) {
  const dd = Math.min(1, Math.max(0, Math.abs(value || 0)));
  const w = 230, h = 28;
  const fillW = Math.min(w, (dd / 0.5) * w);
  return (
    <div style={{margin:"0 6px"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontFamily:"Orbitron",fontSize:7,color:T.secondary,letterSpacing:2}}>MAX DD</span>
        <span style={{fontFamily:"DM Mono",fontSize:12,color:T.coral,fontWeight:500,textShadow:"0 0 8px var(--red)"}}>{(dd*100).toFixed(1)}%</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:h}}>
        <rect x="0" y="0" width={w} height={h} fill={T.coral+"20"} />
        <rect x="0" y="0" width={fillW} height={h} fill={T.coral} opacity="0.7" />
        <line x1={w*0.2} y1="0" x2={w*0.2} y2={h} stroke={T.border} strokeWidth="1" strokeDasharray="2 2" />
        <line x1={w*0.4} y1="0" x2={w*0.4} y2={h} stroke={T.border} strokeWidth="1" strokeDasharray="2 2" />
        <text x={w*0.2} y={h-3} textAnchor="middle" fill={T.muted} fontFamily="DM Mono" fontSize="6">10%</text>
        <text x={w*0.4} y={h-3} textAnchor="middle" fill={T.muted} fontFamily="DM Mono" fontSize="6">20%</text>
      </svg>
    </div>
  );
}

// ═══ SVG GAUGE: Trade Counter ═══
function TradeCounter({value, prev}) {
  const count = value ?? 0;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"8px 0"}}>
      <span style={{fontFamily:"DM Mono",fontSize:"28px",fontWeight:500,color:T.teal,textShadow:"0 0 10px var(--cyan)",animation:prev !== count ? "countUp 0.6s ease-out" : "none"}}>
        {count}
      </span>
      <span style={{fontFamily:"Orbitron",fontSize:7,color:T.secondary,letterSpacing:3,marginTop:-2}}>TRADES</span>
    </div>
  );
}

// ═══ CIRCUIT BREAKER PILL ═══
function CircuitBreakerPill({state, onHalt, onClear}) {
  const halted = state?.halted;
  return (
    <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",background:halted ? T.coral+"15" : T.accent+"10",border:`1px solid ${halted ? T.coral+"40" : T.accent+"30"}`}}>
      <div style={{width:8,height:8,background:halted ? T.coral : T.accent,animation:halted ? "pulse 1.5s infinite" : "none",flexShrink:0}} />
      <span style={{fontFamily:"DM Mono",fontSize:9,fontWeight:600,color:halted ? T.coral : T.accent,flex:1}}>
        {halted ? "HALTED" : "OPERATIONAL"}
      </span>
      <button onClick={onHalt} style={{fontFamily:"Orbitron",fontSize:8,background:"transparent",border:`1px solid ${T.coral}`,color:T.coral,padding:"3px 8px",cursor:"pointer"}}>HALT</button>
      <button onClick={onClear} style={{fontFamily:"Orbitron",fontSize:8,background:"transparent",border:`1px solid ${T.accent}`,color:T.accent,padding:"3px 8px",cursor:"pointer"}}>CLEAR</button>
    </div>
  );
}

// ═══ CANDLESTICK SVG ═══
function CandlestickSVG({candles, trades, width=800, height=400}) {
  if (!candles || candles.length === 0) return null;
  const pl = 52, pr = 14, pt = 16, pb = 28;
  const volH = height * 0.18;
  const chartH = height - pt - pb - volH;
  const chartW = width - pl - pr;
  const minP = Math.min(...candles.map(c => c.low));
  const maxP = Math.max(...candles.map(c => c.high));
  const pRange = maxP - minP || 1;
  const maxV = Math.max(...candles.map(c => c.volume), 1);
  const cw = chartW / candles.length;
  const toX = (i) => pl + i * cw;
  const toY = (v) => pt + chartH - ((v - minP) / pRange) * chartH;
  const toVolY = (v) => pt + chartH + volH - (v / maxV) * volH;
  const toTradeX = (ts) => pl + ((ts - candles[0].time) / (candles[candles.length-1].time - candles[0].time || 1)) * chartW;

  const gridLines = [];
  for (let i = 0; i <= 5; i++) {
    const yVal = minP + (pRange * i) / 5;
    const yPos = toY(yVal);
    gridLines.push({y:yPos, label:yVal.toFixed(0)});
  }
  const labelInterval = Math.max(1, Math.floor(candles.length / 8));
  const timeLabels = candles.filter((_,i)=>i%labelInterval===0).map(c=>({x:toX(candles.indexOf(c)), label:new Date(c.time).toLocaleDateString([],{month:"short",day:"numeric"})}));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{width:"100%",height:"100%",display:"block"}}>
      {gridLines.map((gl,i)=>(
        <g key={i}>
          <line x1={pl} y1={gl.y} x2={pl+chartW} y2={gl.y} stroke={T.border} strokeWidth="1" opacity="0.3" />
          <text x={pl-4} y={gl.y+2} textAnchor="end" fill={T.muted} fontFamily="DM Mono" fontSize="7">{gl.label}</text>
        </g>
      ))}
      {timeLabels.map((tl,i)=><text key={i} x={tl.x} y={height-4} textAnchor="middle" fill={T.muted} fontFamily="DM Mono" fontSize="7">{tl.label}</text>)}
      {candles.map((c,i)=>{
        const volBarW = Math.max(1, cw - 1);
        return <rect key={i} x={toX(i)} y={toVolY(c.volume)} width={volBarW} height={pt+chartH+volH-toVolY(c.volume)} fill={c.close >= c.open ? T.accent : T.coral} opacity="0.25" />;
      })}
      {candles.map((c,i)=>{
        const x = toX(i) + cw/2;
        const isUp = c.close >= c.open;
        const col = isUp ? T.accent : T.coral;
        const bodyTop = toY(Math.max(c.open,c.close));
        const bodyBot = toY(Math.min(c.open,c.close));
        const bodyH = Math.max(1, bodyBot - bodyTop);
        return (
          <g key={i}>
            <line x1={x} y1={toY(c.high)} x2={x} y2={toY(c.low)} stroke={col} strokeWidth="1" opacity="0.8" />
            <rect x={x - cw/3} y={bodyTop} width={cw*0.66} height={bodyH} fill={col} opacity="0.85" />
          </g>
        );
      })}
      {trades && trades.map((t,i)=>{
        const openX = toTradeX(t.open_date);
        const closeX = toTradeX(t.close_date);
        const profitCol = t.profit_ratio >= 0 ? T.accent : T.coral;
        const openY = toY(t.open_rate);
        const closeY = toY(t.close_rate);
        const oCandle = candles.reduce((a,c) => Math.abs(c.time - t.open_date) < Math.abs(a.time - t.open_date) ? c : a);
        const cCandle = candles.reduce((a,c) => Math.abs(c.time - t.close_date) < Math.abs(a.time - t.close_date) ? c : a);
        const buyY = toY(oCandle.low) + 4;
        const sellY = toY(cCandle.high) - 4;
        const [tip,setTip] = React.useState(false);
        return (
          <g key={i}>
            <rect x={openX} y={Math.min(openY,closeY)} width={closeX-openX} height={Math.abs(closeY-openY)} fill={profitCol} opacity="0.06" rx="0" />
            <line x1={openX} y1={buyY+4} x2={openX} y2={pt} stroke={T.accent} strokeWidth="1" strokeDasharray="2 4" opacity="0.3" pointerEvents="none" />
            <polygon points={`${openX},${buyY+8} ${openX-4},${buyY} ${openX+4},${buyY}`} fill={T.accent} opacity="0.9" style={{cursor:"pointer"}} onMouseOver={()=>setTip(true)} onMouseOut={()=>setTip(false)} />
            <polygon points={`${closeX},${sellY-8} ${closeX-4},${sellY} ${closeX+4},${sellY}`} fill={profitCol} opacity="0.9" style={{cursor:"pointer"}} onMouseOver={()=>setTip(true)} onMouseOut={()=>setTip(false)} />
            {tip && (
              <g>
                <rect x={openX+6} y={buyY-20} width={110} height={30} fill={T.elevated} stroke={T.border} strokeWidth="1" />
                <text x={openX+10} y={buyY-8} fill={T.text} fontFamily="DM Mono" fontSize="7">{t.open_rate.toFixed(2)} &rarr; {t.close_rate.toFixed(2)}</text>
                <text x={openX+10} y={buyY+2} fill={profitCol} fontFamily="DM Mono" fontSize="7">{(t.profit_ratio*100).toFixed(2)}%</text>
              </g>
            )}
          </g>
        );
      })}
    </svg>
  );
}

// ═══ STRATEGY CHART WRAPPER ═══
function StrategyChart({iterationResults, selectedIteration, onSelectIteration, candles}) {
  const mockCandles = useMemo(() => candles && candles.length > 0 ? candles : generateMockCandles(), [candles]);
  const mockTrades = useMemo(() => generateMockTrades(mockCandles), [mockCandles]);
  const idx = selectedIteration ?? iterationResults.length - 1;
  const latest = iterationResults?.[idx] || iterationResults?.[iterationResults.length-1];
  const realTrades = latest?.trades || latest?.metrics?.trades || [];
  const trades = realTrades.length > 0 ? realTrades : mockTrades;
  return (
    <div style={{flex:1,minWidth:0,background:T.bg,position:"relative",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div className="scanline" />
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 12px",borderBottom:"1px solid var(--border)",flexShrink:0,zIndex:11}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontFamily:"Orbitron",fontSize:13,color:T.text}}>BTC/USDT</span>
          {latest?.strategy_type && (
            <span style={{fontFamily:"DM Mono",fontSize:8,color:T.purple,background:T.purple+"26",padding:"1px 6px"}}>{latest.strategy_type}</span>
          )}
          <span style={{fontFamily:"DM Mono",fontSize:10,color:T.muted}}>1h</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {iterationResults.length > 0 && (
            <>
              <button onClick={() => onSelectIteration(Math.max(0,(selectedIteration||0)-1))} style={{background:"transparent",border:"1px solid var(--border)",color:T.secondary,fontSize:9,padding:"2px 6px",cursor:"pointer"}}>&#9664;</button>
              <span style={{fontFamily:"DM Mono",fontSize:10,color:T.secondary}}>IT {(selectedIteration??iterationResults.length-1)+1} / {iterationResults.length}</span>
              <button onClick={() => onSelectIteration(Math.min(iterationResults.length-1,(selectedIteration||0)+1))} style={{background:"transparent",border:"1px solid var(--border)",color:T.secondary,fontSize:9,padding:"2px 6px",cursor:"pointer"}}>&#9654;</button>
            </>
          )}
        </div>
      </div>
      <div style={{flex:1,minHeight:0,position:"relative",zIndex:11}}>
        <CandlestickSVG candles={mockCandles} trades={trades} width={800} height={400} />
      </div>
    </div>
  );
}

// ═══ SHARPE LINE CHART ═══
function SharpeLineChart({results, selectedIteration, onSelect}) {
  const [tooltip,setTooltip] = useState(null);
  if (!results || results.length < 2) {
    return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:T.muted,fontSize:9,fontFamily:"DM Mono"}}>Not enough data</div>;
  }
  const sorted = [...results].sort((a,b)=>(a.iteration||0)-(b.iteration||0));
  let runningBest = -Infinity;
  const points = sorted.map((r,i)=>{
    const iter = r.iteration || i+1;
    const sharpe = r.sharpe_ratio ?? 0;
    const isRecord = sharpe > runningBest + 1e-9;
    if (isRecord) runningBest = sharpe;
    return {iter, sharpe, isRecord, verdict: r.verdict, strategy: r.strategy_type||r.strategy};
  });
  const w = 500, h = 150, pl = 38, pr = 14, pt = 12, pb = 22;
  const cw = w - pl - pr, ch = h - pt - pb;
  const yVals = points.map(p=>p.sharpe);
  const yMin = Math.min(...yVals, 0);
  const yMax = Math.max(...yVals, 0.01);
  const yR = yMax - yMin || 0.01;
  const toX = (i) => pl + ((i)/(points.length-1||1))*cw;
  const toY = (v) => pt + ch - ((v-yMin)/yR)*ch;
  const dots = points.map((p,i)=>({...p,x:toX(i),y:toY(p.sharpe)}));
  const allLine = dots.map(p=>`${p.x},${p.y}`).join(" ");
  const recDots = dots.filter(p=>p.isRecord);
  const recLine = recDots.map(p=>`${p.x},${p.y}`).join(" ");
  return (
    <div style={{width:"100%",height:"100%",position:"relative"}}>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",height:"100%",display:"block"}}>
        <defs><linearGradient id="slg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.gold} stopOpacity="0.10"/><stop offset="100%" stopColor={T.gold} stopOpacity="0.02"/></linearGradient></defs>
        <line x1={pl} y1={toY(0)} x2={pl+cw} y2={toY(0)} stroke={T.border} strokeWidth="1" strokeDasharray="3 3" opacity="0.4"/>
        <line x1={pl} y1={toY(0.8)} x2={pl+cw} y2={toY(0.8)} stroke={T.accent} strokeWidth="1" strokeDasharray="3 4" opacity="0.4"/>
        <text x={pl+cw+2} y={toY(0.8)+2} fill={T.muted} fontFamily="DM Mono" fontSize="6">TARGET</text>
        {[0.25,0.5,0.75].map(f=>{
          const y = pt+ch*f;
          return <line key={f} x1={pl} y1={y} x2={pl+cw} y2={y} stroke={T.border} strokeWidth="1" strokeDasharray="2 3" opacity="0.15"/>;
        })}
        {dots.length>0&&<polyline points={allLine} fill="none" stroke={T.muted} strokeWidth="1.5" opacity="0.35" strokeLinejoin="round"/>}
        {recDots.length>1&&<polygon points={`${recLine} ${pl+cw},${pt+ch} ${pl},${pt+ch}`} fill="url(#slg)"/>}
        {recDots.length>1&&<polyline points={recLine} fill="none" stroke={T.gold} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" style={{transition:"d 0.3s ease-out"}}/>}
        {dots.map((p,i)=>{
          const ptCol = p.verdict==="kept"||p.verdict==="converged" ? T.accent : p.verdict==="discarded" ? T.coral : p.isRecord ? T.gold : T.muted;
          return <rect key={i} x={p.x-2} y={p.y-2} width={4} height={4} fill={p.isRecord?T.gold:ptCol} opacity={p.isRecord?1:0.5} style={{cursor:"pointer"}} onMouseOver={()=>setTooltip({x:p.x,y:p.y,iter:p.iter,sharpe:p.sharpe,verdict:p.verdict,strategy:p.strategy})} onMouseOut={()=>setTooltip(null)} onClick={()=>onSelect&&onSelect(i)}/>;
        })}
        <text x={pl-4} y={pt+4} textAnchor="end" fill={T.muted} fontFamily="DM Mono" fontSize="7">{yMax.toFixed(2)}</text>

// ═══ STRATEGY RADAR ═══
function StrategyRadar({currentStrategy, regimeSnapshot}) {
  const axes = [
    {label:"SHARPE", value:(currentStrategy?.sharpe_ratio||0)/3, max:3},
    {label:"WIN RATE", value:currentStrategy?.win_rate||0, max:1},
    {label:"PROFIT FACTOR", value:Math.min((currentStrategy?.profit_factor||0)/3,1), max:3},
    {label:"MAX DD (INV)", value:1-Math.min(Math.abs(currentStrategy?.max_drawdown||0)/0.5,1), max:0.5},
    {label:"TRADE FREQ", value:Math.min(Math.log10((currentStrategy?.total_trades||1)+1)/2.3,1), max:100},
    {label:"REGIME FIT", value:currentStrategy?.regime&&regimeSnapshot?.regime?(currentStrategy.regime===regimeSnapshot.regime?1:0.5):0.5, max:1},
  ];
  const cx = 120, cy = 95, r = 70;
  const angleStep = (2 * Math.PI) / 6;
  const getPoint = (i, scale) => ({x: cx + r * scale * Math.cos(angleStep * i - Math.PI/2), y: cy + r * scale * Math.sin(angleStep * i - Math.PI/2)});
  const polyPoints = axes.map((a,i)=>getPoint(i,a.value));
  const outerHex = Array.from({length:7},(_,i)=>getPoint(i%6,1)).map(p=>`${p.x},${p.y}`).join(" ");
  const inner33 = Array.from({length:7},(_,i)=>getPoint(i%6,0.33)).map(p=>`${p.x},${p.y}`).join(" ");
  const inner66 = Array.from({length:7},(_,i)=>getPoint(i%6,0.66)).map(p=>`${p.x},${p.y}`).join(" ");
  const dataPts = polyPoints.map(p=>`${p.x},${p.y}`).join(" ");
  return (
    <svg viewBox="0 0 240 180" style={{width:"100%",height:"100%"}}>
      <polygon points={outerHex} fill="none" stroke={T.border} strokeWidth="1" />
      <polygon points={inner66} fill="none" stroke={T.border} strokeWidth="1" opacity="0.2" />
      <polygon points={inner33} fill="none" stroke={T.border} strokeWidth="1" opacity="0.2" />
      {Array.from({length:6},(_,i)=>{
        const p = getPoint(i,1);
        return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke={T.border} strokeWidth="1" opacity="0.3"/>;
      })}
      <polygon points={dataPts} fill={T.blue+"26"} stroke={T.blue} strokeWidth="1.5" />
      <circle cx={cx} cy={cy} r="3" fill={T.blue} />
      {axes.map((a,i)=>{
        const p = getPoint(i,1.2);
        return <text key={i} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle" fill={T.secondary} fontFamily="Orbitron" fontSize="7" letterSpacing="1">{a.label}</text>;
      })}
    </svg>
  );
}

// ═══ ITERATION TABLE ═══
function IterationTable({results, selected, onSelect}) {
  if (!results || results.length === 0) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:T.muted,fontSize:9,fontFamily:"DM Mono"}}>No iterations</div>;
  const sorted = [...results].reverse().slice(0,8);
  const newestIdx = results.length > 0 ? results.length - 1 : -1;
  return (
    <div style={{overflowY:"auto",height:"100%"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:9}}>
        <thead>
          <tr style={{fontFamily:"Orbitron",fontSize:7,color:T.secondary,letterSpacing:1}}>
            <th style={{padding:"2px 4px",textAlign:"left",borderBottom:"1px solid var(--border)"}}>#</th>
            <th style={{padding:"2px 4px",textAlign:"right",borderBottom:"1px solid var(--border)"}}>Sharpe</th>
            <th style={{padding:"2px 4px",textAlign:"right",borderBottom:"1px solid var(--border)"}}>WR</th>
            <th style={{padding:"2px 4px",textAlign:"right",borderBottom:"1px solid var(--border)"}}>DD</th>
            <th style={{padding:"2px 4px",textAlign:"right",borderBottom:"1px solid var(--border)"}}>Trades</th>
            <th style={{padding:"2px 4px",textAlign:"left",borderBottom:"1px solid var(--border)"}}>V</th>
          </tr>
        </thead>

            const isSelected = selected === idx;

            const disc = r.verdict === "discarded";

              <tr key={r.iteration||i} onClick={()=>onSelect(idx)} style={{cursor:"pointer",background:isSelected?T.elevated:idx===newestIdx?T.gold+"12":"transparent",borderLeft:kept?`2px solid ${T.accent}`:disc?`2px solid ${T.coral}`:"2px solid transparent",transition:"background 0.2s",animation:idx===newestIdx?"fadeIn 0.6s ease-out":"none"}} onMouseOver={e=>e.currentTarget.style.background=T.elevated} onMouseOut={e=>{if(!isSelected&&idx!==newestIdx)e.currentTarget.style.background="transparent"}}>
                <td style={{padding:"2px 4px",color:T.muted,fontFamily:"DM Mono"}}>{r.iteration}</td>

// WEBSOCKET HOOK
// ═══════════════════════════════════════════════
function useWebSocket(url, handlers) {
  const wsRef = useRef(null);
  const handlersRef = useRef(handlers);
  handlersRef.current = handlers;
  const reconnectTimer = useRef(null);
  const mountCount = useRef(0);

  useEffect(() => {
    mountCount.current += 1;
    const mountId = mountCount.current;
    let stopped = false;

    function connect() {
      if (stopped) return;
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host;
      const ws = new WebSocket(`${protocol}//${host}${url}`);
      wsRef.current = ws;

      ws.onopen = () => {
        if (mountId !== mountCount.current) return;
        if (handlersRef.current.onOpen) handlersRef.current.onOpen();
      };
      ws.onmessage = (evt) => {
        if (mountId !== mountCount.current) return;
        try {
          const msg = JSON.parse(evt.data);
          if (handlersRef.current.onMessage) handlersRef.current.onMessage(msg);
        } catch(e) {}
      };
      ws.onclose = () => {
        if (stopped) return;
        reconnectTimer.current = setTimeout(connect, 3000);
      };
      ws.onerror = () => { ws.close(); };
    }

    connect();
    return () => {
      stopped = true;
      if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
      if (wsRef.current) { wsRef.current.onclose = null; wsRef.current.close(); }
    };
  }, [url]);

  const send = useCallback((data) => {
    if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify(data));
    }
  }, []);

  return send;
}

// API HOOK
// ═══════════════════════════════════════════════
function useApi() {
  const apiBase = `/api`;
  const call = useCallback(async (path, opts = {}) => {
    const r = await fetch(`${apiBase}${path}`, {
      headers: { "Content-Type":"application/json", ...opts.headers },
      ...opts,
    });
    if (!r.ok) { const err = await r.text(); throw new Error(err); }
    return r.json();
  }, []);
  return call;
}

const LS_KEY = "cabot_ui_state";
function loadPersistedState() {
  try {

    if (raw) return JSON.parse(raw);

}
function persistState(state) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}

  const [regimeSnapshot,setRegimeSnapshot] = useState(null);
  const [autonomousState,setAutonomousState] = useState(null);
  const [iterationResults,setIterationResults] = useState([]);
  const [iterationSummary,setIterationSummary] = useState(null);
  const [riskPortfolio,setRiskPortfolio] = useState(null);
  const [startupStatus,setStartupStatus] = useState(null);
  const [dataHealth,setDataHealth] = useState(null);
  const [loading,setLoading] = useState({});
  const [autoStarting,setAutoStarting] = useState(false);
  const [autoStopping,setAutoStopping] = useState(false);
  const [autoPausing,setAutoPausing] = useState(false);
  const [goal,setGoal] = useState("Optimize single pair BTCUSDT spot scalping");
  const [cycles,setCycles] = useState(5);
  const [iters,setIters] = useState(1);
  const [selectedIteration, setSelectedIteration] = useState(null);
  const [candles, setCandles] = useState(null);
  const [hypothesis, setHypothesis] = useState(null);

  const api = useApi();

  // ─── Restore persisted state ───
  useEffect(()=>{
    const saved = loadPersistedState();
    if(saved) {
      if(saved.positions) setPositions(saved.positions);
      if(saved.circuitBreaker) setCircuitBreaker(saved.circuitBreaker);
      if(saved.regimeSnapshot) setRegimeSnapshot(saved.regimeSnapshot);
      if(saved.autonomousState) setAutonomousState(saved.autonomousState);
      if(saved.iterationResults) setIterationResults(saved.iterationResults);
      if(saved.iterationSummary) setIterationSummary(saved.iterationSummary);
      if(saved.iterationData?.results) setIterationResults(saved.iterationData.results);
      if(saved.riskPortfolio) setRiskPortfolio(saved.riskPortfolio);
      if(saved.startupStatus) setStartupStatus(saved.startupStatus);
      if(saved.dataHealth) setDataHealth(saved.dataHealth);
      if(saved.goal) setGoal(saved.goal);
    }
  }, []);

  // ─── Persist on changes ───
  useEffect(()=>{
    persistState({positions,circuitBreaker,regimeSnapshot,autonomousState,iterationResults,iterationSummary,riskPortfolio,startupStatus,dataHealth,goal});
  }, [positions,circuitBreaker,regimeSnapshot,autonomousState,iterationResults,iterationSummary,riskPortfolio,startupStatus,dataHealth,goal]);

  // ─── Initial data fetch ───
  useEffect(()=>{
    async function fetchInitial() {
      setLoading(p=>({...p,autonomous:true,circuit:true,regime:true,positions:true,iterations:true}));
      try {
        const [auto,iter,pos,strat,sig,cb,regime,risk,startup,health] = await Promise.allSettled([
          api("/autonomous/status"), api("/autonomous/iterations"), api("/positions/open"),
          api("/strategies"), api("/signals/feed"), api("/circuit-breaker/status"),
          api("/regime/current"), api("/risk/portfolio"), api("/startup/status"), api("/data/health"),
        ]);
        if(auto.status==="fulfilled"&&auto.value) setAutonomousState(auto.value);
        if(iter.status==="fulfilled"&&iter.value) {
          setIterationResults(iter.value.results||[]);
          setIterationSummary(iter.value);
        }
        if(pos.status==="fulfilled") setPositions(Array.isArray(pos.value)?pos.value:pos.value?.positions||[]);
        if(strat.status==="fulfilled") setStrategies(Array.isArray(strat.value)?strat.value:strat.value?.strategies||[]);
        if(sig.status==="fulfilled") setSignals(Array.isArray(sig.value)?sig.value:sig.value?.signals||[]);
        if(cb.status==="fulfilled") setCircuitBreaker(cb.value);
        if(regime.status==="fulfilled") setRegimeSnapshot(regime.value);
        if(risk.status==="fulfilled") setRiskPortfolio(risk.value);
        if(startup.status==="fulfilled") setStartupStatus(startup.value);
        if(health.status==="fulfilled") setDataHealth(health.value);
      } finally {
        setLoading({});
      }
    }
    fetchInitial();
  }, [api]);

  // ─── WebSocket handler ───
  const wsHandlers = useMemo(()=>({
    onMessage(msg) {
      const {type,payload} = msg;
      if(!type) return;
      switch(type) {
        case "autonomous_update":
          setAutonomousState(payload);
          break;
        case "iteration_complete":
        case "research_update":
          setIterationResults(prev => {
            const result = payload;
            const existing = prev.findIndex(r => r.iteration === result.iteration);
            if (existing >= 0) {
              const next = [...prev];
              next[existing] = result;
              return next;
            }
            return [...prev, result];
          });
          setIterationSummary(payload);
          break;
        case "position_update":
          setPositions(payload?.positions||(Array.isArray(payload)?payload:[]));
          break;
        case "signal":
          setSignals(prev=>{
            const next=[payload||msg,...prev].slice(0,500);
            return next;
          });
          break;
        case "circuit_breaker":
          setCircuitBreaker(payload);
          break;
        case "regime_update":
          setRegimeSnapshot(payload);
          break;
        case "risk_update":
          setRiskPortfolio(payload);
          break;
        case "startup_update":
          setStartupStatus(payload);
          break;
        case "run_start":
        case "run_complete":
        case "run_error":
        case "hypothesis":
          setHypothesis(payload?.text || payload?.hypothesis || JSON.stringify(payload));
          break;
        case "critique":
        case "iteration_start":
        case "iteration_result":
        case "task_done":
          setEvents(prev=>[...prev,{
            id:Date.now()+Math.random(),
            timestamp:msg.timestamp?new Date(msg.timestamp).toLocaleTimeString():"",
            type,
            payload:payload||msg,
          }].slice(-200));
          if(type==="run_start") {
            setAutonomousState(p=>p||{is_running:true,current_goal:payload?.goal});
            setIterationResults([]);
            setIterationSummary(null);
          }
          if(type==="run_complete") setAutonomousState(p=>({...p,is_running:false}));
          if(type==="run_error") setAutonomousState(p=>({...p,is_running:false,last_error:payload?.message}));
          if(type==="iteration_result") setIterationResults(prev => {
            const result = payload?.metrics || payload;
            const existing = prev.findIndex(r => r.iteration === result.iteration);
            if (existing >= 0) {
              const next = [...prev];
              next[existing] = result;
              return next;
            }
            return [...prev, result];
          });
          break;
        case "heartbeat":
          break;
        case "log":
          setTerminalLog(prev=>[...prev,{...payload,id:Date.now()+Math.random()}].slice(-500));
          break;
      }
    },
  }),[]);

  const wsSend = useWebSocket("/ws/autonomous", wsHandlers);

  // ─── Actions ───
  const startAutonomous = useCallback(async()=>{
    setAutoStarting(true);
    try { await api("/autonomous/start",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoStarting(false)}
  },[api]);

  const stopAutonomous = useCallback(async()=>{
    setAutoStopping(true);
    try { await api("/autonomous/stop",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoStopping(false)}
  },[api]);

  const pauseAutonomous = useCallback(async()=>{
    setAutoPausing(true);
    try { await api("/autonomous/pause",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoPausing(false)}
  },[api]);

  const resumeAutonomous = useCallback(async()=>{
    setAutoPausing(true);
    try { await api("/autonomous/resume",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoPausing(false)}
  },[api]);

  const haltCircuitBreaker = useCallback(async()=>{
    try { await api("/circuit-breaker/halt",{method:"POST"}); }
    catch(e){console.error(e)}
  },[api]);

  const clearCircuitBreaker = useCallback(async()=>{
    try { await api("/circuit-breaker/clear",{method:"POST"}); }
    catch(e){console.error(e)}
  },[api]);

  const fetchIterationDetail = useCallback(async (iterationId) => {
    try {
      const [tradesRes, candlesRes] = await Promise.allSettled([
        api(`/iterations/${iterationId}/trades`),
        api(`/iterations/${iterationId}/candles`),
      ]);
      if (tradesRes.status === "fulfilled" && tradesRes.value?.length > 0) {
        setIterationResults(prev => prev.map(r =>
          r.iteration === iterationId ? { ...r, trades: tradesRes.value } : r
        ));
      }
      if (candlesRes.status === "fulfilled" && candlesRes.value?.length > 0) {
        setCandles(candlesRes.value);
      }
    } catch(e) {
      console.warn("fetchIterationDetail failed, using mock data", e);
    }
  },[api]);

  const startResearch = useCallback((input, c, i)=>{
    const finalGoal = input||goal;
    setGoal(finalGoal);
    setShowModal(false);
    api("/run",{method:"POST",body:JSON.stringify({goal:finalGoal,max_cycles:c ?? cycles,max_iterations:i ?? iters})})
      .catch(e=>console.error(e));
  },[api,goal,cycles,iters]);

  // ─── Effective iteration ───
  const effectiveIteration = selectedIteration ?? (iterationResults.length - 1);

  // ─── Render ───
  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <Topbar status={autonomousState?.is_running?"running":autonomousState?.is_paused?"paused":"stopped"}
              regime={regimeSnapshot?.regime}
              confidence={regimeSnapshot?.confidence}
              goal={autonomousState?.current_goal}
              tokens={tokens}
              onNewResearch={()=>setShowModal(true)}
              isRunning={autonomousState?.is_running}
              isPaused={autonomousState?.is_paused}
              starting={autoStarting}
              stopping={autoStopping}
              pausing={autoPausing}
              onStart={startAutonomous}
              onStop={stopAutonomous}
              onPause={pauseAutonomous}
              onResume={resumeAutonomous} />
      <div className="main">
        <LeftSidebar events={events} hypothesis={hypothesis} />
        <StrategyChart iterationResults={iterationResults}
                       selectedIteration={selectedIteration}
                       onSelectIteration={setSelectedIteration}
                       candles={candles} />
        <RightSidebar iterationResults={iterationResults}
                      circuitBreaker={circuitBreaker}
                      onHalt={haltCircuitBreaker}
                      onClear={clearCircuitBreaker} />
      </div>
      <BottomStrip iterationResults={iterationResults}
                   selectedIteration={effectiveIteration}
                   onSelectIteration={setSelectedIteration}
                   regimeSnapshot={regimeSnapshot} />
      {showModal && (
        <ResearchModal goal={goal} cycles={cycles} iters={iters}
          onStart={startResearch} onClose={()=>setShowModal(false)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
