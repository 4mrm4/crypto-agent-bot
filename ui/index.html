<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>crypto_agent_bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<style>
/* ─── Reset & Base ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%}
body{background:#020617;color:#F8FAFC;font-family:'Exo 2',sans-serif;font-size:13px;line-height:1.6;overflow:hidden}
/* ─── CSS Variables ─── */
:root{
  --bg:#020617;
  --surface:#0F172A;
  --elevated:#1E293B;
  --card:#0A0F1E;
  --border:rgba(255,255,255,0.06);
  --border-hover:rgba(255,255,255,0.12);
  --text:#F8FAFC;
  --secondary:#94A3B8;
  --muted:#64748B;
  --accent:#22C55E;
  --coral:#EF4444;
  --teal:#14B8A6;
  --gold:#F59E0B;
  --sage:#22C55E;
  --radius:8px;
  --radius-sm:6px;
  --shadow:0 2px 8px rgba(0,0,0,0.3);
}

/* ─── Scrollbar ─── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a32;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#3a3a42}

/* ─── Utility ─── */
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flex{display:flex}
.flex-col{flex-direction:column}
.gap-2{gap:2px}
.gap-4{gap:4px}
.gap-6{gap:6px}
.gap-8{gap:8px}
.gap-10{gap:10px}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.flex-1{flex:1}
.min-h-0{min-height:0}
.shrink-0{flex-shrink:0}
.text-mono{font-family:'DM Mono',monospace;font-size:12px}

/* ─── Animations ─── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes stampIn{0%{opacity:0;transform:scale(0.95)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes slideUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}

/* ─── Card base ─── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:border-color 0.2s;
}
.card:hover{border-color:var(--border-hover)}
.card-accent{position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--radius) var(--radius) 0 0}
.card-pad{padding:16px}

/* ─── Dashboard Grid (bento) ─── */
.dash-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  flex:1;min-height:0;
  overflow-y:auto;
  padding:4px 0;
  align-content:start;
}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.dash-grid{grid-template-columns:1fr}}

/* ─── Data tables ─── */
table.data-table{width:100%;border-collapse:collapse}
table.data-table th{
  padding:6px 10px;
  font-family:'Orbitron',sans-serif;
  font-size:8px;
  font-weight:500;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1.8px;
  text-align:left;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.02);
}
table.data-table td{padding:6px 10px;border-bottom:1px solid var(--border);font-size:12px}
table.data-table tr:last-child td{border-bottom:none}
table.data-table tr:hover td{background:rgba(255,255,255,0.03)}

/* ─── Section heading ─── */
.section-heading{
  font-family:'Orbitron',sans-serif;
  font-size:9px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:2.5px;
  margin-bottom:12px;
}

/* ─── Status dot ─── */
.status-dot{
  width:8px;height:8px;
  border-radius:50%;
  flex-shrink:0;
}

/* ─── Buttons ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  font-family:'Exo 2',sans-serif;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  gap:6px;
  text-transform:none;
}
.btn:hover{opacity:0.85;transform:translateY(-0.5px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-primary{
  background:var(--accent);
  color:#020617;
  border-color:var(--accent);
  font-weight:700;
  box-shadow:0 0 12px rgba(34,197,94,0.15);
}
.btn-primary:hover{box-shadow:0 0 20px rgba(34,197,94,0.3);opacity:1}
.btn-danger{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn-ghost{background:transparent;color:var(--secondary);border-color:var(--border)}

/* ─── Inputs & Selects ─── */
.input-field{
  padding:7px 12px;
  border-radius:var(--radius-sm);
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-size:11px;
  font-family:'Exo 2',sans-serif;
  outline:none;
  transition:border-color .2s;
}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ─── Mini stat ─── */
.mini-stat{
  padding:6px 10px;
  background:var(--surface);
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
}
.mini-stat-label{
  font-size:8px;
  color:var(--muted);
  font-family:'Orbitron',sans-serif;
  text-transform:uppercase;
  letter-spacing:1.2px;
  margin-bottom:2px;
}
.mini-stat-value{
  font-size:14px;
  font-weight:600;
  font-family:'DM Mono',monospace;
}

/* ─── Skeleton loading ─── */
.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--elevated) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ─── Signal badge ─── */
.badge-buy{display:inline-block;padding:1px 10px;border-radius:var(--radius-sm);background:rgba(34,197,94,0.15);color:var(--accent);font-weight:600;font-size:9px;font-family:'Exo 2',sans-serif;text-transform:uppercase;letter-spacing:0.5px}
.badge-sell{display:inline-block;padding:1px 10px;border-radius:var(--radius-sm);background:rgba(239,68,68,0.15);color:var(--coral);font-weight:600;font-size:9px;font-family:'Exo 2',sans-serif;text-transform:uppercase;letter-spacing:0.5px}
.badge-hold{display:inline-block;padding:1px 10px;border-radius:var(--radius-sm);background:rgba(100,116,139,0.15);color:var(--muted);font-weight:600;font-size:9px;font-family:'Exo 2',sans-serif;text-transform:uppercase;letter-spacing:0.5px}

/* ─── Button ─── */
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface)}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,createContext,useContext} = React;

// ═══════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════
const T = {
  bg:"#020617",surface:"#0F172A",elevated:"#1E293B",card:"#0A0F1E",
  border:"#1E293B",text:"#F8FAFC",secondary:"#94A3B8",muted:"#64748B",
  accent:"#22C55E",coral:"#EF4444",teal:"#14B8A6",gold:"#F59E0B",sage:"#22C55E",
};

// ═══════════════════════════════════════════════
// UTILITY HELPERS
// ═══════════════════════════════════════════════
const fmtPnl = (v) => v != null ? `${v >= 0 ? "+" : ""}${(v * 100).toFixed(2)}%` : "\u2014";
const fmtTime = (ts) => ts ? new Date(ts).toLocaleTimeString() : "\u2014";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const Skeleton = ({w,h,style}) => <div className="skel" style={{width:w||"100%",height:h||20,...style}} />;
const EmptyState = ({icon,title,sub}) => (
  <div style={{textAlign:"center",padding:40,flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
    <div style={{fontSize:28,color:T.muted,opacity:0.15,marginBottom:10}}>{icon||"\u25CB"}</div>
    <div style={{fontSize:11,color:T.muted}}>{title}</div>
    {sub && <div style={{fontSize:9,color:T.muted,marginTop:4}}>{sub}</div>}
  </div>
);

const SectionHeading = ({children,accent,extra}) => (
  <div className="flex items-center justify-between shrink-0" style={{marginBottom:10}}>
    <h2 className="section-heading">{children}</h2>
    {extra}
  </div>
);
const Accent = ({color=T.gold}) => <div className="card-accent" style={{background:`linear-gradient(90deg,${color},transparent)`}} />;
const MiniStat = ({label,value,color=T.secondary,small}) => (
  <div className="mini-stat">
    <div className="mini-stat-label">{label}</div>
    <div className="mini-stat-value" style={{fontSize:small?11:13,color}}>{value}</div>
  </div>
);
const ConfBar = ({conf,size=50}) => (
  <div className="flex items-center gap-6">
    <div style={{width:size,height:4,background:T.surface,borderRadius:2,overflow:"hidden"}}>
      <div style={{width:`${clamp(conf*100,0,100)}%`,height:"100%",background:conf>=0.6?T.sage:conf>=0.3?T.gold:T.muted,borderRadius:2,transition:"width .3s"}} />
    </div>
    <span className="text-mono" style={{fontSize:9,fontWeight:600,color:conf>=0.6?T.sage:conf>=0.3?T.gold:T.muted}}>{(conf*100).toFixed(0)}%</span>
  </div>
);

// ═══════════════════════════════════════════════
// STATE CONTEXT + PERSISTENCE
// ═══════════════════════════════════════════════
const LS_KEY = "cabot_ui_state";

function loadPersistedState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) { /* ignore */ }
  return null;
}
function persistState(state) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) { /* ignore */ }
}

// ═══════════════════════════════════════════════
// WEBSOCKET HOOK
// ═══════════════════════════════════════════════
function useWebSocket(url, handlers) {
  const wsRef = useRef(null);
  const handlersRef = useRef(handlers);
  handlersRef.current = handlers;
  const reconnectTimer = useRef(null);
  const mountCount = useRef(0);

  useEffect(() => {
    mountCount.current += 1;
    const mountId = mountCount.current;
    let stopped = false;

    function connect() {
      if (stopped) return;
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host;
      const ws = new WebSocket(`${protocol}//${host}${url}`);
      wsRef.current = ws;

      let initLogged = 0;

      ws.onopen = () => {
        if (mountId !== mountCount.current) return;
        if (handlersRef.current.onOpen) handlersRef.current.onOpen();
      };
      ws.onmessage = (evt) => {
        if (mountId !== mountCount.current) return;
        try {
          const msg = JSON.parse(evt.data);
          if (initLogged < 5) { initLogged++; }
          if (handlersRef.current.onMessage) handlersRef.current.onMessage(msg);
        } catch(e) { /* ignore parse errors */ }
      };
      ws.onclose = () => {
        if (stopped) return;
        reconnectTimer.current = setTimeout(connect, 3000);
      };
      ws.onerror = () => { ws.close(); };
    }

    connect();
    return () => {
      stopped = true;
      if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
      if (wsRef.current) { wsRef.current.onclose = null; wsRef.current.close(); }
    };
  }, [url]);

  const send = useCallback((data) => {
    if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify(data));
    }
  }, []);

  return send;
}

// ═══════════════════════════════════════════════
// API HOOK
// ═══════════════════════════════════════════════
function useApi() {
  const apiBase = `/api`;
  const call = useCallback(async (path, opts = {}) => {
    const r = await fetch(`${apiBase}${path}`, {
      headers: { "Content-Type":"application/json", ...opts.headers },
      ...opts,
    });
    if (!r.ok) { const err = await r.text(); throw new Error(err); }
    return r.json();
  }, []);
  return call;
}

// ═══════════════════════════════════════════════
// SKELETON LOADING WRAPPER
// ═══════════════════════════════════════════════
function LazyLoad({loading,children,height=60}) {
  if (loading) return <Skeleton w="100%" h={height} />;
  return children;
}

// ═══════════════════════════════════════════════
// SHARPE HISTORY CHART
// ═══════════════════════════════════════════════
function SharpeChart({results}) {
  if (!results || results.length < 1) {
    return (
      <div className="card card-pad">
        <Accent color={T.gold} />
        <SectionHeading>Sharpe History</SectionHeading>
        <div style={{fontSize:10,color:T.muted,textAlign:"center",padding:16}}>
          No iterations yet
        </div>
      </div>
    );
  }

  const sorted = [...results].sort((a, b) => (a.iteration||0) - (b.iteration||0));
  let runningBest = -Infinity;
  const points = sorted.map((r, idx) => {
    const iter = (r.iteration != null && r.iteration > 0) ? r.iteration : idx + 1;
    const sharpe = r.sharpe_ratio ?? r.sharpe ?? 0;
    const isRecord = sharpe > runningBest + 1e-9;
    if (isRecord) runningBest = sharpe;
    return {iter, sharpe, isRecord};
  });

  const bestGlobal = Math.max(...points.map(p=>p.sharpe));
  const w=700,h=130,pl=40,pr=14,pt=10,pb=22;
  const cw=w-pl-pr, ch=h-pt-pb;
  const xV=points.map(p=>p.iter), yV=points.map(p=>p.sharpe);
  const xMin=Math.min(...xV), xMax=Math.max(...xV);
  const yMin=Math.min(...yV,0), yMax=Math.max(...yV,0.01);
  const xR=xMax-xMin||1, yR=yMax-yMin||0.01;
  const toX=v=>pl+((v-xMin)/xR)*cw;
  const toY=v=>pt+ch-((v-yMin)/yR)*ch;
  const dots=points.map(p=>({...p,x:toX(p.iter),y:toY(p.sharpe)}));
  const allLine = dots.map(p => `${p.x},${p.y}`).join(" ");
  const recDots = dots.filter(p => p.isRecord);
  const recLine = recDots.map(p => `${p.x},${p.y}`).join(" ");
  const best = dots.find(p => p.sharpe >= bestGlobal - 0.0001);
  const isBestLast = best === dots[dots.length - 1];

  return (
    <div className="card card-pad">
      <Accent color={T.gold} />
      <SectionHeading>Sharpe History</SectionHeading>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width:"100%",display:"block"}}>
        <defs>
          <linearGradient id="sg-rec" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={T.gold} stopOpacity="0.12" />
            <stop offset="100%" stopColor={T.gold} stopOpacity="0.02" />
          </linearGradient>
        </defs>
        {[0.25,0.5,0.75].map((f,i)=>(
          <line key={i} x1={pl} y1={pt+ch*f} x2={pl+cw} y2={pt+ch*f} stroke={T.border} strokeWidth="1" strokeDasharray="3 3" />
        ))}
        {yMin<0&&yMax>0&&(
          <line x1={pl} y1={toY(0)} x2={pl+cw} y2={toY(0)} stroke={T.muted} strokeWidth="1" strokeDasharray="2 4" opacity={0.3} />
        )}
        {dots.length > 0 && <polyline points={allLine} fill="none" stroke={T.muted} strokeWidth="1.5" strokeOpacity="0.4" strokeLinejoin="round" strokeLinecap="round" />}
        {recDots.length>1&&<polygon points={`${recLine} ${pl+cw},${pt+ch} ${pl},${pt+ch}`} fill="url(#sg-rec)" />}
        {recDots.length>1&&<polyline points={recLine} fill="none" stroke={T.gold} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />}
        {dots.map((p,i)=>!p.isRecord&&<circle key={i} cx={p.x} cy={p.y} r="2.5" fill={T.muted} stroke="none" opacity={0.25} />)}
        {recDots.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3" fill={T.gold} stroke={T.card} strokeWidth="1.5" />)}
        {best&&(<>
          <circle cx={best.x} cy={best.y} r="7" fill="none" stroke={isBestLast?T.sage:T.gold} strokeWidth="2" opacity={0.5} />
          <circle cx={best.x} cy={best.y} r="4" fill={isBestLast?T.sage:T.gold} stroke={T.card} strokeWidth="1.5" />
        </>)}
        <text x={pl-4} y={pt+4} fill={T.muted} fontSize="8" textAnchor="end" fontFamily="DM Mono">{yMax.toFixed(2)}</text>
        <text x={pl-4} y={pt+ch+4} fill={T.muted} fontSize="8" textAnchor="end" fontFamily="DM Mono">{yMin.toFixed(2)}</text>
        <text x={pl} y={h-2} fill={T.muted} fontSize="8" fontFamily="DM Mono">{xMin}</text>
        <text x={w-pr} y={h-2} fill={T.muted} fontSize="8" textAnchor="end" fontFamily="DM Mono">{xMax}</text>
      </svg>
    </div>
  );
}

// ═══════════════════════════════════════════════
// LOG PANEL
// ═══════════════════════════════════════════════
function EventLogPanel({events}) {
  const [collapsed,setCollapsed] = useState(true);
  const scrollRef = useRef(null);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight},[events]);

  return (
    <div className="card" style={{display:"flex",flexDirection:"column",overflow:"hidden",transition:"max-height .3s",maxHeight:collapsed?32:300}}>
      <div className="flex items-center justify-between shrink-0" style={{padding:"6px 16px",cursor:"pointer"}} onClick={()=>setCollapsed(!collapsed)}>
        <h2 className="section-heading" style={{marginBottom:0,fontSize:9}}>Event Log</h2>
        <div className="flex items-center gap-6">
          <span style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace"}}>{events.length}</span>
          <span style={{color:T.muted,fontSize:10}}>{collapsed?"\u25BC":"\u25B2"}</span>
        </div>
      </div>
      {!collapsed&&(
        <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:"2px 16px 8px",fontSize:11,fontFamily:"'DM Mono',monospace",lineHeight:1.9,color:T.secondary}}>
          {events.length===0?(<span style={{color:T.muted}}>Waiting for events...</span>):events.map(evt=>(
            <div key={evt.id} className="flex gap-8">
              <span style={{color:T.muted,flexShrink:0,fontSize:10}}>{evt.timestamp}</span>
              <span style={{color:evt.type==="anomaly"?T.coral:evt.type==="decay_alert"?T.gold:evt.type==="run_error"?T.coral:T.accent,flexShrink:0,fontSize:10}}>[{evt.type}]</span>
              <span className="truncate" style={{color:T.text,fontSize:10}}>{(typeof evt.payload==="string"?evt.payload:JSON.stringify(evt.payload)).slice(0,180)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TerminalLogPanel({events}) {
  const [collapsed,setCollapsed] = useState(true);
  const scrollRef = useRef(null);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight},[events]);

  return (
    <div className="card" style={{display:"flex",flexDirection:"column",overflow:"hidden",transition:"max-height .3s",maxHeight:collapsed?32:220}}>
      <div className="flex items-center justify-between shrink-0" style={{padding:"6px 16px",cursor:"pointer"}} onClick={()=>setCollapsed(!collapsed)}>
        <h2 className="section-heading" style={{marginBottom:0,fontSize:9}}>Terminal Log</h2>
        <div className="flex items-center gap-6">
          <span style={{fontSize:9,color:T.muted,fontFamily:"'DM Mono',monospace"}}>{events.length}</span>
          <span style={{color:T.muted,fontSize:10}}>{collapsed?"\u25BC":"\u25B2"}</span>
        </div>
      </div>
      {!collapsed&&(
        <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:"2px 16px 8px",fontSize:11,fontFamily:"'DM Mono',monospace",lineHeight:1.7,color:T.secondary}}>
          {events.length===0?(<span style={{color:T.muted}}>Waiting for log output...</span>):events.map((evt,i)=>(
            <div key={i} className="flex gap-8">
              <span style={{color:T.muted,flexShrink:0,fontSize:9}}>{evt.timestamp}</span>
              <span style={{color:evt.level==="error"?T.coral:evt.level==="warning"?T.gold:evt.level==="debug"?T.muted:T.accent,flexShrink:0,fontSize:9}}>[{evt.level?evt.level.toUpperCase():"INFO"}]</span>
              <span style={{color:T.text,whiteSpace:"pre-wrap",wordBreak:"break-word",fontSize:10}}>{evt.message||JSON.stringify(evt).slice(0,300)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════
// HEADER / NAVIGATION
// ═══════════════════════════════════════════════
const NAV_ITEMS = [
  {id:"dashboard",label:"Dashboard"},
  {id:"research",label:"Research"},
  {id:"strategies",label:"Strategies"},
  {id:"signals",label:"Signals"},
];

function Header({activeView,setActiveView,autonomousState,onNewResearch}) {
  const isRunning = autonomousState?.is_running;
  return (
    <header style={{
      display:"flex",alignItems:"center",justifyContent:"space-between",
      padding:"0 20px",borderBottom:`1px solid ${T.border}`,
      background:T.card,flexShrink:0,minHeight:52,
    }}>
      {/* Left: Brand + Nav */}
      <div className="flex items-center" style={{gap:28}}>
        <div className="flex items-center" style={{gap:10}}>
          <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:700,color:T.accent,letterSpacing:"1.5px",textTransform:"uppercase"}}>
            CAB
          </span>
          <div className="flex items-center gap-2" style={{padding:"2px 8px",background:T.surface,borderRadius:"0 4px 0 4px",border:`1px solid ${T.border}`}}>
            <div className="status-dot" style={{background:isRunning?T.accent:T.muted,animation:isRunning?"pulse 1.5s ease-in-out infinite":"none"}} />
            <span className="text-mono" style={{fontSize:8,fontWeight:500,color:isRunning?T.accent:T.muted,textTransform:"uppercase",letterSpacing:"0.8px"}}>
              {isRunning?"Live":"Standby"}
            </span>
          </div>
        </div>
        <nav className="flex items-center" style={{gap:4,height:52}}>
          {NAV_ITEMS.map(item=>(
            <button key={item.id} onClick={()=>setActiveView(item.id)}
              style={{
                position:"relative",
                padding:"0 14px",
                height:"100%",
                background:"transparent",
                border:"none",
                color:activeView===item.id?T.text:T.muted,
                cursor:"pointer",fontSize:11,fontWeight:activeView===item.id?600:400,
                fontFamily:"'Exo 2',sans-serif",
                letterSpacing:"0.3px",
                transition:"color .2s",
              }}>
              {item.label}
              {activeView===item.id && (
                <div style={{position:"absolute",bottom:0,left:8,right:8,height:2,background:T.accent,borderRadius:"1px 1px 0 0",boxShadow:`0 0 8px ${T.accent}60`}} />
              )}
            </button>
          ))}
        </nav>
      </div>

      {/* Right: New Research */}
      <button onClick={onNewResearch} className="btn btn-primary" style={{padding:"7px 18px",fontSize:10}}>
        <span style={{fontSize:15,lineHeight:1}}>+</span> New Research
      </button>
    </header>
  );
}

// ═══════════════════════════════════════════════
// MODAL — New Research Run
// ═══════════════════════════════════════════════
function ResearchModal({goal:initialGoal,cycles:initialCycles,iters:initialIters,onStart,onClose}) {
  const [input,setInput] = useState(initialGoal);
  const [cycles,setCycles] = useState(initialCycles);
  const [iters,setIters] = useState(initialIters);

  return (
    <div style={{
      position:"fixed",inset:0,zIndex:1000,
      display:"flex",alignItems:"center",justifyContent:"center",
      background:"rgba(0,0,0,0.75)",backdropFilter:"blur(4px)",
      WebkitBackdropFilter:"blur(4px)",
    }} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{
        width:460,maxWidth:"90vw",animation:"stampIn .3s ease-out",
        background:T.card,borderRadius:"0 14px 0 14px",
        border:`1px solid ${T.border}`,padding:28,position:"relative",overflow:"hidden",
      }}>
        <div style={{position:"absolute",top:0,left:0,width:36,height:36,borderTop:`2px solid ${T.gold}`,borderLeft:`2px solid ${T.gold}`}} />
        <div style={{position:"absolute",bottom:0,right:0,width:36,height:36,borderBottom:`2px solid ${T.teal}`,borderRight:`2px solid ${T.teal}`}} />

        <div style={{marginBottom:22}}>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:700,color:T.text,letterSpacing:"0.5px"}}>New Research Run</div>
          <p style={{fontSize:11,color:T.muted,marginTop:6}}>Configure research experiment parameters</p>
        </div>

        <label style={{fontSize:9,color:T.muted,fontWeight:600,display:"block",textTransform:"uppercase",letterSpacing:"2px",fontFamily:"'Orbitron',sans-serif",marginBottom:6}}>Goal</label>
        <textarea rows={3} value={input} onChange={e=>setInput(e.target.value)} style={{
          width:"100%",resize:"vertical",fontFamily:"'Exo 2',sans-serif",fontSize:12,
          padding:"10px 14px",borderRadius:"var(--radius-sm)",background:T.surface,
          border:`1px solid ${T.border}`,color:T.text,marginBottom:20,outline:"none",
          transition:"border-color .2s",
        }} onFocus={e=>e.target.style.borderColor=T.accent} onBlur={e=>e.target.style.borderColor=T.border} />

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:24}}>
          <div>
            <label style={{fontSize:9,color:T.muted,fontWeight:600,display:"block",textTransform:"uppercase",letterSpacing:"1.5px",fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>
              Max Cycles: <span style={{color:T.accent,fontFamily:"'DM Mono',monospace",fontSize:11}}>{cycles}</span>
            </label>
            <input type="range" min={1} max={10} value={cycles} onChange={e=>setCycles(Number(e.target.value))} style={{width:"100%",margin:"8px 0",accentColor:T.accent}} />
            <div className="flex justify-between text-mono" style={{fontSize:9,color:T.muted}}><span>1</span><span>10</span></div>
          </div>
          <div>
            <label style={{fontSize:9,color:T.muted,fontWeight:600,display:"block",textTransform:"uppercase",letterSpacing:"1.5px",fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>
              Max Iterations: <span style={{color:T.accent,fontFamily:"'DM Mono',monospace",fontSize:11}}>{iters}</span>
            </label>
            <input type="range" min={1} max={10} value={iters} onChange={e=>setIters(Number(e.target.value))} style={{width:"100%",margin:"8px 0",accentColor:T.accent}} />
            <div className="flex justify-between text-mono" style={{fontSize:9,color:T.muted}}><span>1</span><span>10</span></div>
          </div>
        </div>

        <div className="flex" style={{gap:10,justifyContent:"flex-end"}}>
          <button onClick={onClose} className="btn btn-ghost">Cancel</button>
          <button onClick={()=>onStart(input, cycles, iters)} className="btn btn-primary" style={{padding:"8px 22px"}}>Start Run</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// VIEW: DASHBOARD
// ═══════════════════════════════════════════════
function DashboardView({autonomousState,circuitBreaker,regimeSnapshot,positions,tokens,iterationSummary,iterationResults,loading,startupStatus,riskPortfolio,dataHealth,startAutonomous,stopAutonomous,pauseAutonomous,resumeAutonomous,autoStarting,autoStopping,autoPausing,haltCircuitBreaker,clearCircuitBreaker,terminalLog,events}) {
  const isRunning = autonomousState?.is_running;
  const isPaused = autonomousState?.is_paused;

  // ─── Autonomous Loop Card ───
  const autoCard = (
    <div className="card card-pad" style={{display:"flex",flexDirection:"column",gap:10}}>
      <Accent color={T.gold} />
      <SectionHeading>Autonomous Loop</SectionHeading>
      {loading.autonomous ? <Skeleton w="100%" h={60} /> : <>
        <div className="flex items-center gap-10">
          <div className="status-dot" style={{width:10,height:10,background:isRunning?(isPaused?T.gold:T.sage):T.muted,animation:isRunning&&!isPaused?"pulse 1.5s ease-in-out infinite":"none"}} />
          <span className="text-mono" style={{fontSize:14,fontWeight:700,color:isRunning?(isPaused?T.gold:T.sage):T.muted}}>{isRunning?(isPaused?"PAUSED":"RUNNING"):"STOPPED"}</span>
        </div>
        {autonomousState?.current_goal&&<div style={{padding:"6px 10px",background:T.surface,borderRadius:4,border:`1px solid ${T.border}`}}>
          <div className="text-mono" style={{fontSize:8,color:T.muted,marginBottom:2}}>Current Goal</div>
          <div style={{fontSize:10.5,color:T.text,lineHeight:1.4}}>{autonomousState.current_goal}</div>
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          <MiniStat label="Cycles" value={autonomousState?.total_cycles||0} color={T.teal} small />
          <MiniStat label="Sharpe" value={autonomousState?.current_sharpe?.toFixed(2)||"\u2014"} color={T.gold} small />
          <MiniStat label="Best" value={autonomousState?.current_best_sharpe?.toFixed(2)||"\u2014"} color={T.sage} small />
        </div>
        {autonomousState?.last_error&&<div style={{padding:"4px 8px",background:`${T.coral}10`,borderRadius:4,border:`1px solid ${T.coral}30`}}>
          <div className="text-mono" style={{fontSize:9,color:T.coral}}>Error: {autonomousState.last_error}</div>
        </div>}
      </>}
      <div className="flex gap-6">
        {!isRunning?(
          <button onClick={startAutonomous} disabled={autoStarting} className="btn btn-primary" style={{flex:1}}>
            {autoStarting?"Starting...":"Start"}
          </button>
        ):(
          <>
            {!isPaused?(
              <button onClick={pauseAutonomous} disabled={autoPausing} className="btn" style={{background:T.gold,borderColor:T.gold,color:"#020617",flex:1}}>Pause</button>
            ):(
              <button onClick={resumeAutonomous} disabled={autoPausing} className="btn btn-primary" style={{flex:1}}>Resume</button>
            )}
            <button onClick={stopAutonomous} disabled={autoStopping} className="btn btn-danger" style={{flex:1}}>Stop</button>
          </>
        )}
      </div>
    </div>
  );

  // ─── Circuit Breaker + Regime Card ───
  const cbCard = (
    <div className="card card-pad" style={{display:"flex",flexDirection:"column",gap:10}}>
      <Accent color={T.coral} />
      <SectionHeading>Circuit Breaker &amp; Regime</SectionHeading>

      {loading.circuit ? <Skeleton w="100%" h={60} /> : <div style={{padding:"8px 12px",borderRadius:6,background:circuitBreaker?.halted?`${T.coral}15`:T.surface,border:`1px solid ${circuitBreaker?.halted?T.coral:T.border}`}}>
        <div className="flex items-center gap-8">
          <div className="status-dot" style={{width:8,height:8,background:circuitBreaker?.halted?T.coral:T.sage,animation:circuitBreaker?.halted?"pulse 1.5s ease-in-out infinite":"none"}} />
          <span className="text-mono" style={{fontSize:12,fontWeight:700,color:circuitBreaker?.halted?T.coral:T.sage}}>{circuitBreaker?.halted?"HALTED":"OPERATIONAL"}</span>
        </div>
        {circuitBreaker?.reason&&<div className="text-mono" style={{fontSize:9,color:T.muted,marginTop:4}}>{circuitBreaker.reason}</div>}
        {circuitBreaker?.triggered_by&&<div className="text-mono" style={{fontSize:8,color:T.muted,marginTop:2}}>Triggered by: {circuitBreaker.triggered_by}</div>}
        {circuitBreaker?.resume_after&&<div className="text-mono" style={{fontSize:8,color:T.gold,marginTop:2}}>Resume after: {circuitBreaker.resume_after}</div>}
        <div className="flex gap-6" style={{marginTop:8}}>
          <button onClick={haltCircuitBreaker} className="btn btn-danger" style={{padding:"5px 14px",fontSize:9}}>Halt</button>
          <button onClick={clearCircuitBreaker} className="btn" style={{padding:"5px 14px",fontSize:9,color:T.accent,borderColor:T.accent}}>Clear</button>
        </div>
      </div>}
      /* Regime */
      {loading.regime ? <Skeleton w="100%" h={60} /> : (regimeSnapshot?<>
        <div className="flex items-center justify-between">
          <div>
            <div className="text-mono" style={{fontSize:13,fontWeight:700,color:T.gold,textTransform:"uppercase"}}>{regimeSnapshot.regime?.replace(/_/g," ")||"\u2014"}</div>
            {regimeSnapshot.confidence!=null&&<div className="text-mono" style={{fontSize:9,color:T.muted,marginTop:1}}>Confidence: {(regimeSnapshot.confidence*100).toFixed(0)}%</div>}
          </div>
          {regimeSnapshot.adx!=null&&<MiniStat label="ADX" value={regimeSnapshot.adx.toFixed(1)} color={regimeSnapshot.adx>25?T.teal:T.muted} small />}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
          {regimeSnapshot.atr_pct!=null&&<MiniStat label="ATR%" value={(regimeSnapshot.atr_pct*100).toFixed(1)+"%"} color={T.gold} small />}
          {regimeSnapshot.sma200_distance!=null&&<MiniStat label="200SMA Dist" value={regimeSnapshot.sma200_distance?.toFixed(2)||"\u2014"} color={T.secondary} small />}
        </div>
        {regimeSnapshot.recommended_strategies?.length>0&&<div className="text-mono" style={{fontSize:7,color:T.muted}}>Recommended: {regimeSnapshot.recommended_strategies.join(", ")}</div>}
        {regimeSnapshot.discouraged_strategies?.length>0&&<div className="text-mono" style={{fontSize:7,color:T.coral}}>Avoid: {regimeSnapshot.discouraged_strategies.join(", ")}</div>}
      </>:<div style={{fontSize:10,color:T.muted}}>No regime data yet.</div>)}
    </div>
  );

  // ─── Research Results Card ───
  const resultsCard = (
    <div className="card card-pad" style={{display:"flex",flexDirection:"column",maxHeight:280,overflow:"hidden"}}>
      <Accent color={T.gold} />
      <SectionHeading>Research Results</SectionHeading>
      {loading.iterations ? <Skeleton w="100%" h={180} /> : <>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:10}}>
          <MiniStat label="Best Sharpe" value={iterationSummary?.best_sharpe?.toFixed(2)||"\u2014"} color={T.gold} small />
          <MiniStat label="Discarded" value={iterationSummary?.discarded_count||0} color={T.coral} small />
          <MiniStat label="Kept" value={iterationSummary?.kept_count||0} color={T.sage} small />
          <MiniStat label="Total It" value={iterationResults.length||0} color={T.teal} small />
        </div>
        {iterationResults.length>0&&(
          <div style={{flex:1,overflowY:"auto"}}>
            <table className="data-table" style={{fontSize:9}}>
              <thead><tr><th>It</th><th>Sharpe</th><th>WR</th><th>DD</th><th>Trades</th><th>Verdict</th></tr></thead>
              <tbody>{iterationResults.slice(-30).reverse().map((r,i)=>(
                <tr key={i}>
                  <td style={{padding:"2px 6px",color:T.muted}}>{r.iteration}</td>
                  <td style={{padding:"2px 6px",color:r.sharpe_ratio>=0.8?T.sage:r.sharpe_ratio>=0?T.text:T.coral}}>{r.sharpe_ratio?.toFixed(2)||"\u2014"}</td>
                  <td style={{padding:"2px 6px",color:T.text}}>{r.win_rate?`${(r.win_rate*100).toFixed(0)}%`:"\u2014"}</td>
                  <td style={{padding:"2px 6px",color:T.text}}>{r.max_drawdown?`${(Math.abs(r.max_drawdown)*100).toFixed(1)}%`:"\u2014"}</td>
                  <td style={{padding:"2px 6px",color:T.text}}>{r.total_trades||0}</td>
                  <td style={{padding:"2px 6px",color:r.verdict==="kept"||r.verdict==="converged"?T.sage:T.coral,fontWeight:600}}>
                    {r.verdict==="kept"?"KEPT":r.verdict==="converged"?"KEPT":r.verdict==="discarded"?"DISCARDED":r.verdict||"\u2014"}
                  </td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        )}
      </>}
    </div>
  );

  // ─── Live Positions Card ───
  const positionsCard = (
    <div className="card card-pad" style={{display:"flex",flexDirection:"column",maxHeight:280,overflow:"hidden"}}>
      <Accent color={T.teal} />
      <SectionHeading>Live Positions</SectionHeading>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
        <MiniStat label="Open Positions" value={riskPortfolio?.total_open_positions??positions.length} color={T.teal} small />
        <MiniStat label="Daily PnL" value={fmtPnl(riskPortfolio?.daily_pnl_pct)} color={(riskPortfolio?.daily_pnl_pct||0)>=0?T.sage:T.coral} small />
      </div>
      {loading.positions ? <Skeleton w="100%" h={60} /> : (
        positions.length===0?<EmptyState icon={"\u25CB"} title="No open positions" sub="Signals will appear when opportunities are detected" />:
        <div style={{flex:1,overflowY:"auto"}}>
          <table className="data-table" style={{fontSize:9.5}}>
            <thead><tr><th>Pair</th><th>Side</th><th>Size</th><th>Entry</th><th>PnL</th><th>Duration</th></tr></thead>
            <tbody>{positions.map((p,i)=>(
              <tr key={i}>
                <td style={{padding:"4px 6px",color:T.text,fontWeight:600}}>{p.pair||"\u2014"}</td>
                <td style={{padding:"4px 6px",color:p.side==="buy"||p.side==="long"?T.sage:T.coral,fontWeight:600}}>{(p.side||"\u2014").toUpperCase()}</td>
                <td style={{padding:"4px 6px",color:T.text}}>{p.size||"\u2014"}</td>
                <td style={{padding:"4px 6px",color:T.text}}>{p.entry_price?`$${p.entry_price}`:"\u2014"}</td>
                <td style={{padding:"4px 6px",color:(p.pnl_pct||0)>=0?T.sage:T.coral,fontWeight:600}}>{fmtPnl(p.pnl_pct)}</td>
                <td style={{padding:"4px 6px",color:T.muted}}>{fmtTime(p.entry_time)}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      )}
    </div>
  );

  // ─── Bottom Row: Portfolio Risk, Startup, Data Health ───
  const miniCards = (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
      {/* Portfolio Risk */}
      <div className="card card-pad">
        <Accent color={T.gold} />
        <SectionHeading>Portfolio Risk</SectionHeading>
        {riskPortfolio?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          <MiniStat label="Open" value={riskPortfolio.total_open_positions??"\u2014"} color={T.teal} small />
          <MiniStat label="Daily PnL" value={fmtPnl(riskPortfolio.daily_pnl_pct)} color={(riskPortfolio.daily_pnl_pct||0)>=0?T.sage:T.coral} small />
          <MiniStat label="Weekly PnL" value={fmtPnl(riskPortfolio.weekly_pnl_pct)} color={(riskPortfolio.weekly_pnl_pct||0)>=0?T.sage:T.coral} small />
          <MiniStat label="Max DD" value={riskPortfolio.max_drawdown!=null?`${(Math.abs(riskPortfolio.max_drawdown)*100).toFixed(1)}%`:"\u2014"} color={T.coral} small />
        </div>:<div style={{fontSize:10,color:T.muted}}>Waiting for data...</div>}
      </div>
      {/* Startup Status */}
      <div className="card card-pad">
        <Accent color={T.accent} />
        <SectionHeading>Startup Tasks</SectionHeading>
        {startupStatus?.tasks?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {Object.entries(startupStatus.tasks).map(([k,t])=>{
            const c=t.status==="running"?T.accent:t.status==="failed"?T.coral:t.status==="stopped"?T.muted:T.gold;
            return (<div key={k} style={{padding:"5px 10px",background:T.surface,borderRadius:"var(--radius-sm)",border:`1px solid ${T.border}`}}>
              <div className="flex items-center justify-between gap-4">
                <span style={{fontSize:9,color:T.muted,fontWeight:500}}>{k.replace(/_/g," ")}</span>
                <span className="text-mono" style={{fontSize:8,color:c,fontWeight:600,flexShrink:0}}>{t.status}</span>
              </div>
              {t.error&&<div style={{fontSize:8,color:T.coral,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.error}</div>}
            </div>);
          })}
        </div>:<div style={{fontSize:11,color:T.muted}}>No startup data</div>}
      </div>
      {/* Data Health */}
      <div className="card card-pad">
        <Accent color={T.teal} />
        <SectionHeading>Data Sources</SectionHeading>
        {dataHealth&&Object.keys(dataHealth).length>0?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {Object.entries(dataHealth).slice(0,6).map(([name,s])=>{
            const h=s.is_healthy!==false;
            return (<div key={name} style={{padding:"5px 10px",background:T.surface,borderRadius:"var(--radius-sm)",border:`1px solid ${T.border}`}}>
              <div className="flex items-center justify-between">
                <span style={{fontSize:9,color:T.muted,fontWeight:500}}>{name.replace(/_/g," ")}</span>
                <span className="text-mono" style={{fontSize:8,color:h?T.accent:T.coral}}>{h?"OK":"DOWN"}</span>
              </div>
              {s.last_success&&<div className="text-mono" style={{fontSize:8,color:T.muted,marginTop:1}}>{fmtTime(s.last_success)}</div>}
            </div>);
          })}
        </div>:<div style={{fontSize:11,color:T.muted}}>No source data</div>}
      </div>
    </div>
  );

  return (
    <div className="dash-grid">
      {autoCard}
      {cbCard}
      {resultsCard}
      {positionsCard}
      <div style={{gridColumn:"1/-1"}}><SharpeChart results={iterationResults} /></div>
      <div style={{gridColumn:"1/-1"}}>{miniCards}</div>
      <div style={{gridColumn:"1/-1"}}><TerminalLogPanel events={terminalLog} /></div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// VIEW: RESEARCH (iteration detail / explorer)
// ═══════════════════════════════════════════════
function ResearchView({iterationSummary,iterationResults,events,terminalLog,autonomousState}) {
  const results = iterationResults;
  const hasData = results?.length>0;

  return (
    <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",gap:10,overflow:"hidden"}}>
      {/* Summary stats */}
      <div className="card card-pad">
        <Accent color={T.gold} />
        <SectionHeading>Research Overview</SectionHeading>
        {!hasData?<EmptyState icon={"\u25C9"} title="No research data yet" sub="Start an autonomous run or use New Research to begin" />:<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6,marginBottom:10}}>
            <MiniStat label="Best Sharpe" value={iterationSummary?.best_sharpe?.toFixed(2)||"\u2014"} color={T.gold} />
            <MiniStat label="Kept" value={iterationSummary?.kept_count||0} color={T.sage} />
            <MiniStat label="Discarded" value={iterationSummary?.discarded_count||0} color={T.coral} />
            <MiniStat label="Total Iterations" value={results.length} color={T.teal} />
            <MiniStat label="Total Cycles" value={autonomousState?.total_cycles||0} color={T.secondary} />
            <MiniStat label="Current Sharpe" value={autonomousState?.current_sharpe?.toFixed(2)||"\u2014"} color={T.gold} />
          </div>
        </>}
      </div>

      {/* Full results table */}
      <div className="card card-pad" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <Accent color={T.teal} />
        <SectionHeading>Iteration History ({results?.length||0})</SectionHeading>
        {!hasData?<EmptyState icon={"\u25B4"} title="No iterations yet" sub="Run autonomous research to populate" />:
        <div style={{flex:1,overflowY:"auto"}}>
          <table className="data-table">
            <thead><tr><th>It</th><th>Sharpe</th><th>Win Rate</th><th>Max DD</th><th>Trades</th><th>Profit</th><th>Verdict</th><th>Strategy</th></tr></thead>
            <tbody>{[...results].reverse().map((r,i)=>(
              <tr key={i}>
                <td style={{padding:"4px 8px",color:T.muted,fontWeight:600}}>{r.iteration}</td>
                <td style={{padding:"4px 8px",color:r.sharpe_ratio>=0.8?T.sage:r.sharpe_ratio>=0?T.text:T.coral,fontWeight:700}}>{r.sharpe_ratio?.toFixed(2)||"\u2014"}</td>
                <td style={{padding:"4px 8px",color:T.text}}>{r.win_rate?`${(r.win_rate*100).toFixed(0)}%`:"\u2014"}</td>
                <td style={{padding:"4px 8px",color:Math.abs(r.max_drawdown||0)<0.05?T.sage:Math.abs(r.max_drawdown||0)<0.1?T.gold:T.coral}}>{r.max_drawdown?`${(Math.abs(r.max_drawdown)*100).toFixed(1)}%`:"\u2014"}</td>
                <td style={{padding:"4px 8px",color:T.text}}>{r.total_trades||0}</td>
                <td style={{padding:"4px 8px",color:(r.profit||0)>=0?T.sage:T.coral}}>{r.profit!=null?fmtPnl(r.profit):"\u2014"}</td>
                <td style={{padding:"4px 8px",color:r.verdict==="kept"||r.verdict==="converged"?T.sage:T.coral,fontWeight:600}}>
                  {r.verdict==="kept"?"KEPT":r.verdict==="converged"?"KEPT":r.verdict==="discarded"?"DISCARDED":r.verdict||"\u2014"}
                </td>
                <td style={{padding:"4px 8px",color:T.secondary,fontSize:9}}>{r.strategy_name||r.strategy_type||"\u2014"}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>}
      </div>

      {/* Chart + Logs row */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <SharpeChart results={results} />
        <EventLogPanel events={events} />
      </div>
      <TerminalLogPanel events={terminalLog} />
    </div>
  );
}

// ═══════════════════════════════════════════════
// VIEW: STRATEGY LIBRARY
// ═══════════════════════════════════════════════
function StrategyLibraryView({strategies}) {
  const [search,setSearch] = useState("");
  const [regimeFilter,setRegimeFilter] = useState("all");

  const regimes = useMemo(()=>{
    const s=new Set(); (strategies||[]).forEach(r=>{if(r.regime)s.add(r.regime)});
    return ["all",...Array.from(s)];
  },[strategies]);

  const filtered = useMemo(()=>{
    let items=strategies||[];
    if(search.trim()){const q=search.toLowerCase();items=items.filter(s=>(s.strategy_type||s.name||"").toLowerCase().includes(q)||(s.regime||s.metadata?.regime||"").toLowerCase().includes(q))}
    if(regimeFilter!=="all")items=items.filter(s=>s.regime===regimeFilter);
    return items;
  },[strategies,search,regimeFilter]);

  return (
    <div className="card card-pad" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <Accent color={T.teal} />
      <div className="flex items-center justify-between gap-12 shrink-0" style={{marginBottom:10}}>
        <h2 className="section-heading" style={{marginBottom:0}}>Strategy Library ({filtered.length})</h2>
        <div className="flex gap-6 items-center">
          <input type="text" placeholder="Filter strategies..." value={search} onChange={e=>setSearch(e.target.value)} className="input-field" style={{width:140}} />
          <select value={regimeFilter} onChange={e=>setRegimeFilter(e.target.value)} className="input-field" style={{cursor:"pointer"}}>
            {regimes.map(r=><option key={r} value={r}>{r==="all"?"All Regimes":r.replace(/_/g," ")}</option>)}
          </select>
        </div>
      </div>
      {filtered.length===0?<EmptyState icon={"\u25C9"} title={strategies.length===0?"No deployable strategies yet":"No strategies match your filter"} sub="Run autonomous research to discover strategies" />:
      <div style={{flex:1,overflowY:"auto"}}>
        <table className="data-table">
          <thead><tr><th>Name</th><th>Type</th><th>Regime</th><th>Sharpe</th><th>Win Rate</th><th>Max DD</th><th>Status</th></tr></thead>
          <tbody>{filtered.map((s,i)=>{
            const sharpe=s.sharpe||s.metadata?.sharpe||0;
            const wr=s.win_rate||s.metadata?.win_rate||0;
            const dd=Math.abs(s.max_drawdown||s.metadata?.max_drawdown||0);
            const name=s.strategy_type||s.name||"Unnamed";
            const type=s.strategy_type||"\u2014";
            const regime=s.regime||s.metadata?.regime||"\u2014";
            const status=dd>0.1?"\u26A0 Decaying":"\u25CF Active";
            return (<tr key={i}>
              <td style={{padding:"5px 8px",color:T.text,fontWeight:600,fontSize:10}}>{name}</td>
              <td style={{padding:"5px 8px",color:T.secondary}}>{type}</td>
              <td style={{padding:"5px 8px",color:T.gold}}>{regime}</td>
              <td style={{padding:"5px 8px",color:sharpe>=0.8?T.sage:sharpe>=0?T.text:T.coral,fontWeight:700}}>{typeof sharpe==="number"?sharpe.toFixed(2):"\u2014"}</td>
              <td style={{padding:"5px 8px",color:T.text}}>{typeof wr==="number"?`${(wr*100).toFixed(0)}%`:"\u2014"}</td>
              <td style={{padding:"5px 8px",color:dd<0.05?T.sage:dd<0.1?T.gold:T.coral}}>{typeof dd==="number"?`${(dd*100).toFixed(1)}%`:"\u2014"}</td>
              <td style={{padding:"5px 8px",color:status.includes("Active")?T.sage:T.gold,fontWeight:600}}>{status}</td>
            </tr>);
          })}</tbody>
        </table>
      </div>}
    </div>
  );
}

// ═══════════════════════════════════════════════
// VIEW: SIGNAL FEED
// ═══════════════════════════════════════════════
function SignalFeedView({signals}) {
  const data = useMemo(()=>Array.isArray(signals)?[...signals].reverse().slice(0,100):[], [signals]);

  return (
    <div className="card card-pad" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <Accent color={T.gold} />
      <SectionHeading>Signal Feed ({data.length})</SectionHeading>
      {data.length===0?<EmptyState icon={"\u25CB"} title="No signals evaluated yet" sub="Signals appear here when the scanner detects opportunities" />:
      <div style={{flex:1,overflowY:"auto"}}>
        <table className="data-table">
          <thead><tr><th>Time</th><th>Pair</th><th>Signal</th><th>Strategy</th><th>Confidence</th><th>Regime</th><th>Status</th></tr></thead>
          <tbody>{data.map((s,i)=>{
            const sig=s.signal||s;
            const isBuy=(sig.signal||"").toLowerCase()==="buy";
            const isSell=(sig.signal||"").toLowerCase()==="sell";
            const conf=sig.confidence!=null?sig.confidence:0;
            const time=s.time||(sig.timestamp?fmtTime(sig.timestamp):"\u2014");
            return (<tr key={s.id||i}>
              <td className="text-mono" style={{padding:"4px 8px",color:T.muted,fontSize:9}}>{time}</td>
              <td style={{padding:"4px 8px",color:T.text,fontWeight:600}}>{sig.pair||"\u2014"}</td>
              <td style={{padding:"4px 8px"}}><span className={isBuy?"badge-buy":isSell?"badge-sell":"badge-hold"}>{sig.signal||"hold"}</span></td>
              <td style={{padding:"4px 8px",color:T.secondary}}>{sig.strategy_type||"\u2014"}</td>
              <td style={{padding:"4px 8px"}}><ConfBar conf={conf} /></td>
              <td className="text-mono" style={{padding:"4px 8px",color:T.gold,fontSize:9}}>{sig.regime||"\u2014"}</td>
              <td style={{padding:"4px 8px",color:sig.type==="executed"?T.sage:T.muted,fontWeight:600,fontSize:9}}>{sig.type==="executed"?"EXECUTED":"EVALUATED"}</td>
            </tr>);
          })}</tbody>
        </table>
      </div>}
    </div>
  );
}

// ═══════════════════════════════════════════════
// APP — Main orchestrator
// ═══════════════════════════════════════════════
function App() {
  // ─── View state ───
  const [activeView,setActiveView] = useState("dashboard");
  const [showModal,setShowModal] = useState(false);

  // ─── Data state ───
  const [positions,setPositions] = useState([]);
  const [tokens,setTokens] = useState([]);
  const [strategies,setStrategies] = useState([]);
  const [signals,setSignals] = useState([]);
  const [events,setEvents] = useState([]);
  const [terminalLog,setTerminalLog] = useState([]);
  const [circuitBreaker,setCircuitBreaker] = useState(null);
  const [regimeSnapshot,setRegimeSnapshot] = useState(null);
  const [autonomousState,setAutonomousState] = useState(null);
  const [iterationResults,setIterationResults] = useState([]);
  const [iterationSummary,setIterationSummary] = useState(null);
  const [riskPortfolio,setRiskPortfolio] = useState(null);
  const [startupStatus,setStartupStatus] = useState(null);
  const [dataHealth,setDataHealth] = useState(null);

  // ─── UI state ───
  const [loading,setLoading] = useState({});
  const [autoStarting,setAutoStarting] = useState(false);
  const [autoStopping,setAutoStopping] = useState(false);
  const [autoPausing,setAutoPausing] = useState(false);

  // ─── Modal params ───
  const [goal,setGoal] = useState("Optimize single pair BTCUSDT spot scalping");
  const [cycles,setCycles] = useState(5);
  const [iters,setIters] = useState(1);

  const api = useApi();

  // ─── Restore persisted state ───
  useEffect(()=>{
    const saved = loadPersistedState();
    if(saved) {
      if(saved.positions) setPositions(saved.positions);
      if(saved.circuitBreaker) setCircuitBreaker(saved.circuitBreaker);
      if(saved.regimeSnapshot) setRegimeSnapshot(saved.regimeSnapshot);
      if(saved.autonomousState) setAutonomousState(saved.autonomousState);
      // Clear stale iterationData format, use new split format
      if(saved.iterationResults) setIterationResults(saved.iterationResults);
      if(saved.iterationSummary) setIterationSummary(saved.iterationSummary);
      if(saved.iterationData?.results) setIterationResults(saved.iterationData.results);
      if(saved.riskPortfolio) setRiskPortfolio(saved.riskPortfolio);
      if(saved.startupStatus) setStartupStatus(saved.startupStatus);
      if(saved.dataHealth) setDataHealth(saved.dataHealth);
      if(saved.goal) setGoal(saved.goal);
    }
  }, []);

  // ─── Persist on changes ───
  useEffect(()=>{
    persistState({positions,circuitBreaker,regimeSnapshot,autonomousState,iterationResults,iterationSummary,riskPortfolio,startupStatus,dataHealth,goal});
  }, [positions,circuitBreaker,regimeSnapshot,autonomousState,iterationResults,iterationSummary,riskPortfolio,startupStatus,dataHealth,goal]);

  // ─── Initial data fetch ───
  useEffect(()=>{
    async function fetchInitial() {
      setLoading(p=>({...p,autonomous:true,circuit:true,regime:true,positions:true,iterations:true}));
      try {
        const [auto,iter,pos,strat,sig,cb,regime,risk,startup,health] = await Promise.allSettled([
          api("/autonomous/status"), api("/autonomous/iterations"), api("/positions/open"),
          api("/strategies"), api("/signals/feed"), api("/circuit-breaker/status"),
          api("/regime/current"), api("/risk/portfolio"), api("/startup/status"), api("/data/health"),
        ]);
        if(auto.status==="fulfilled"&&auto.value) setAutonomousState(auto.value);
        if(iter.status==="fulfilled"&&iter.value) {
          setIterationResults(iter.value.results||[]);
          setIterationSummary(iter.value);
        }
        if(pos.status==="fulfilled") setPositions(Array.isArray(pos.value)?pos.value:pos.value?.positions||[]);
        if(strat.status==="fulfilled") setStrategies(Array.isArray(strat.value)?strat.value:strat.value?.strategies||[]);
        if(sig.status==="fulfilled") setSignals(Array.isArray(sig.value)?sig.value:sig.value?.signals||[]);
        if(cb.status==="fulfilled") setCircuitBreaker(cb.value);
        if(regime.status==="fulfilled") setRegimeSnapshot(regime.value);
        if(risk.status==="fulfilled") setRiskPortfolio(risk.value);
        if(startup.status==="fulfilled") setStartupStatus(startup.value);
        if(health.status==="fulfilled") setDataHealth(health.value);
      } finally {
        setLoading({});
      }
    }
    fetchInitial();
  }, [api]);

  // ─── WebSocket message handler ───
  const wsHandlers = useMemo(()=>({
    onMessage(msg) {
      const {type,payload} = msg;
      if(!type) return;
      switch(type) {
        case "autonomous_update":
          setAutonomousState(payload);
          break;
        case "iteration_complete":
        case "research_update":
          setIterationResults(prev => {
            const result = payload;
            const existing = prev.findIndex(r => r.iteration === result.iteration);
            if (existing >= 0) {
              const next = [...prev];
              next[existing] = result;
              return next;
            }
            return [...prev, result];
          });
          setIterationSummary(payload);
          break;
        case "position_update":
          setPositions(payload?.positions||(Array.isArray(payload)?payload:[]));
          break;
        case "signal":
          setSignals(prev=>{
            const next=[payload||msg,...prev].slice(0,500);
            return next;
          });
          break;
        case "circuit_breaker":
          setCircuitBreaker(payload);
          break;
        case "regime_update":
          setRegimeSnapshot(payload);
          break;
        case "risk_update":
          setRiskPortfolio(payload);
          break;
        case "startup_update":
          setStartupStatus(payload);
          break;
        case "run_start":
        case "run_complete":
        case "run_error":
        case "hypothesis":
        case "critique":
        case "iteration_start":
        case "iteration_result":
        case "task_done":
          setEvents(prev=>[...prev,{
            id:Date.now()+Math.random(),
            timestamp:msg.timestamp?new Date(msg.timestamp).toLocaleTimeString():"",
            type,
            payload:payload||msg,
          }].slice(-200));
          if(type==="run_start") {
            setAutonomousState(p=>p||{is_running:true,current_goal:payload?.goal});
            setIterationResults([]);
            setIterationSummary(null);
          }
          if(type==="run_complete") setAutonomousState(p=>({...p,is_running:false}));
          if(type==="run_error") setAutonomousState(p=>({...p,is_running:false,last_error:payload?.message}));
          if(type==="iteration_result") setIterationResults(prev => {
            const result = payload?.metrics || payload;
            const existing = prev.findIndex(r => r.iteration === result.iteration);
            if (existing >= 0) {
              const next = [...prev];
              next[existing] = result;
              return next;
            }
            return [...prev, result];
          });
          break;
        case "heartbeat":
          break;
        case "log":
          setTerminalLog(prev=>[...prev,{...payload,id:Date.now()+Math.random()}].slice(-500));
          break;
      }
    },
  }),[]);

  const wsSend = useWebSocket("/ws/autonomous", wsHandlers);

  // ─── Actions ───
  const withLoading = useCallback((key,promise)=>{
    setLoading(l=>({...l,[key]:true}));
    return promise.finally(()=>setLoading(l=>({...l,[key]:false})));
  },[]);

  const startAutonomous = useCallback(async()=>{
    setAutoStarting(true);
    try { await api("/autonomous/start",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoStarting(false)}
  },[api]);

  const stopAutonomous = useCallback(async()=>{
    setAutoStopping(true);
    try { await api("/autonomous/stop",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoStopping(false)}
  },[api]);

  const pauseAutonomous = useCallback(async()=>{
    setAutoPausing(true);
    try { await api("/autonomous/pause",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoPausing(false)}
  },[api]);

  const resumeAutonomous = useCallback(async()=>{
    setAutoPausing(true);
    try { await api("/autonomous/resume",{method:"POST"}); }
    catch(e){console.error(e)}
    finally{setAutoPausing(false)}
  },[api]);

  const haltCircuitBreaker = useCallback(async()=>{
    try { await api("/circuit-breaker/halt",{method:"POST"}); }
    catch(e){console.error(e)}
  },[api]);

  const clearCircuitBreaker = useCallback(async()=>{
    try { await api("/circuit-breaker/clear",{method:"POST"}); }
    catch(e){console.error(e)}
  },[api]);

  const startResearch = useCallback((input, c, i)=>{
    const finalGoal = input||goal;
    setGoal(finalGoal);
    setShowModal(false);
    api("/run",{method:"POST",body:JSON.stringify({goal:finalGoal,max_cycles:c ?? cycles,max_iterations:i ?? iters})})
      .catch(e=>console.error(e));
  },[api,goal,cycles,iters]);

  // ─── Render ───
  const dashProps = {autonomousState,circuitBreaker,regimeSnapshot,positions,tokens,iterationSummary,iterationResults,loading,startupStatus,riskPortfolio,dataHealth,startAutonomous,stopAutonomous,pauseAutonomous,resumeAutonomous,autoStarting,autoStopping,autoPausing,haltCircuitBreaker,clearCircuitBreaker,terminalLog,events};

  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:T.bg,color:T.text}}>
      <Header activeView={activeView} setActiveView={setActiveView} autonomousState={autonomousState} onNewResearch={()=>setShowModal(true)} />

      <main style={{flex:1,display:"flex",flexDirection:"column",padding:"12px 16px",minHeight:0,overflow:"hidden"}}>
        {activeView==="dashboard" && <DashboardView {...dashProps} />}
        {activeView==="research" && <ResearchView iterationSummary={iterationSummary} iterationResults={iterationResults} events={events} terminalLog={terminalLog} autonomousState={autonomousState} />}
        {activeView==="strategies" && <StrategyLibraryView strategies={strategies} />}
        {activeView==="signals" && <SignalFeedView signals={signals} />}
      </main>

      <footer style={{flexShrink:0,padding:"4px 16px",borderTop:`1px solid ${T.border}`,background:T.card,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:7,color:T.muted,fontFamily:"'DM Mono',monospace"}}>
          crypto_agent_bot
        </span>
        <div className="flex items-center gap-8">
          <div className="status-dot" style={{width:4,height:4,background:autonomousState?.is_running?T.sage:T.muted}} />
          <span style={{fontSize:7,color:T.muted,fontFamily:"'DM Mono',monospace"}}>
            {autonomousState?.current_sharpe!=null?`Sharpe: ${autonomousState.current_sharpe.toFixed(2)}`:"Idle"}
          </span>
          <span style={{fontSize:7,color:T.muted,fontFamily:"'DM Mono',monospace"}}>
            {new Date().toLocaleTimeString()}
          </span>
        </div>
      </footer>

      {showModal && (
        <ResearchModal goal={goal} cycles={cycles} iters={iters}
          setGoal={setGoal} setCycles={setCycles} setIters={setIters}
          onStart={startResearch} onClose={()=>setShowModal(false)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
